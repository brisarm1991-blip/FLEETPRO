<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SGP-301 : Système de Gestion du Personnel v8.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --army-green: #2d3e2d; --gold: #c5a059; --danger: #c0392b; --success: #27ae60; --bg: #f0f2f0; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: var(--bg); display: flex; height: 100vh; }
        
        /* Sidebar Styles */
        .sidebar { width: 300px; background: var(--army-green); color: white; display: flex; flex-direction: column; box-shadow: 4px 0 10px rgba(0,0,0,0.2); transition: 0.3s; }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 2px solid var(--gold); }
        .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-item:hover { background: var(--gold); color: var(--army-green); }
        
        /* Content Area */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; }
        
        /* Auth Screen */
        #auth-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a1a, #2d3e2d); z-index: 9999; display: flex; align-items: center; justify-content: center; color: white; }
        .login-card { background: rgba(255,255,255,0.1); padding: 40px; border-radius: 15px; border: 1px solid var(--gold); text-align: center; backdrop-filter: blur(10px); width: 350px; }
        
        /* UI Elements */
        .admin-controls { display: none; margin-bottom: 20px; }
        .is-admin .admin-controls { display: flex; gap: 10px; align-items: center; }
        input:disabled, select:disabled { background: #eee; border: 1px solid #ddd; color: #333; cursor: not-allowed; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    </style>
</head>
<body class="is-visitor">

<div id="auth-overlay">
    <div class="login-card">
        <h1 style="color:var(--gold)">BASE 301</h1>
        <p>Entrez votre Matricule ou Code Admin</p>
        <input type="password" id="loginId" placeholder="Matricule (ex: A15/26261)" style="margin-bottom: 20px; text-align: center; color: black;">
        <button onclick="handleLogin()" style="width:100%; padding:15px; background:var(--gold); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">ACCÉDER AU PORTAIL</button>
        <p style="font-size: 0.7rem; margin-top: 15px; opacity: 0.7;">Système Sécurisé - Usage Officiel</p>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 id="displayRole">PROFIL MILITAIRE</h2>
        <div id="userName" style="color: var(--gold); font-weight: bold;">-</div>
    </div>
    <div class="nav-item" onclick="switchSection('ident')">📋 Ma Fiche d'Identité</div>
    <div class="nav-item" onclick="switchSection('eval')">📈 Mes Performances</div>
    <div class="nav-item" onclick="switchSection('med')">🩺 Suivi Médical</div>
    <button onclick="location.reload()" style="margin-top:auto; padding:20px; background:transparent; color:var(--gold); border:none; cursor:pointer; font-weight:bold;">✖ DÉCONNEXION</button>
</div>

<div class="main-content">
    <div class="admin-controls card">
        <label style="flex:1">Sélectionner un militaire (Mode Admin) :</label>
        <select id="personnelList" onchange="loadMilitaryData(this.value)" style="flex:2"></select>
        <button id="editBtn" onclick="toggleEditMode()" style="flex:1; padding:10px; background:var(--army-green); color:white; border:none; border-radius:5px; cursor:pointer;">MODIFIER</button>
    </div>

    <div id="sec-ident" class="card">
        <h3>Informations Générales</h3>
        <div class="grid-3">
            <div><label>Nom</label><input type="text" id="in-nom" disabled></div>
            <div><label>Prénom</label><input type="text" id="in-prenom" disabled></div>
            <div><label>Grade</label><input type="text" id="in-grade" disabled></div>
            <div><label>Matricule</label><input type="text" id="in-mat" disabled></div>
            <div><label>Spécialité</label><input type="text" id="in-spec" disabled></div>
            <div><label>Position</label>
                <select id="in-pos" disabled>
                    <option value="PRESENT">PRÉSENT</option>
                    <option value="STAGE">STAGE</option>
                    <option value="MISSION">MISSION</option>
                </select>
            </div>
        </div>
    </div>

    <div id="sec-eval" class="grid-3">
        <div class="card" style="grid-column: span 2;">
            <h3>Détail des Notes</h3>
            <div class="grid-3">
                <div><label>Valeur Physique</label><input type="number" id="in-nPhys" disabled></div>
                <div><label>Valeur Intellectuelle</label><input type="number" id="in-nIntel" disabled></div>
                <div><label>Valeur Morale</label><input type="number" id="in-nMor" disabled></div>
                <div><label>Note de Tir</label><input type="number" id="in-nTir" disabled></div>
            </div>
        </div>
        <div class="card">
            <canvas id="radarStats"></canvas>
        </div>
    </div>
</div>

<script>
    // Données consolidées (Simulant vos Excels)
    const personnelDB = [
        { id: "301", role: "ADMIN", nom: "ADMINISTRATEUR", prenom: "BASE", grade: "COL", spec: "COMMANDEMENT" },
        { id: "A15/26261", role: "USER", nom: "EBOK", prenom: "Jean T.", grade: "CAL", spec: "FUSAIR", pos: "PRESENT", nPhys: 14, nIntel: 12, nMor: 21, nTir: 20 },
        { id: "OFF/001", role: "USER", nom: "BALOGOG", prenom: "Patrick", grade: "CNE", spec: "LOG", pos: "STAGE", nPhys: 11.7, nIntel: 15, nMor: 20.4, nTir: 17 },
        { id: "OFF/002", role: "USER", nom: "EMAN", prenom: "Armand Brice", grade: "CNE", spec: "RENS", pos: "PRESENT", nPhys: 16.2, nIntel: 18, nMor: 20.6, nTir: 18 }
    ];

    let currentSession = null;
    let myChart = null;

    function handleLogin() {
        const id = document.getElementById('loginId').value;
        const user = personnelDB.find(u => u.id === id);

        if (user) {
            currentSession = user;
            document.getElementById('auth-overlay').style.display = 'none';
            
            if (user.role === "ADMIN") {
                document.body.className = "is-admin";
                document.getElementById('displayRole').innerText = "PORTAIL COMMANDEMENT";
                populatePersonnelList();
                loadMilitaryData(personnelDB[1].id); // Charge le premier par défaut
            } else {
                document.body.className = "is-visitor";
                document.getElementById('displayRole').innerText = "MON DOSSIER PERSONNEL";
                loadMilitaryData(user.id);
            }
            document.getElementById('userName').innerText = user.grade + " " + user.nom;
        } else {
            alert("Matricule non reconnu. Contactez le secrétariat.");
        }
    }

    function populatePersonnelList() {
        const list = document.getElementById('personnelList');
        list.innerHTML = personnelDB.filter(u => u.role !== "ADMIN")
                                   .map(u => `<option value="${u.id}">${u.grade} ${u.nom}</option>`).join('');
    }

    function loadMilitaryData(id) {
        const p = personnelDB.find(u => u.id === id);
        document.getElementById('in-nom').value = p.nom;
        document.getElementById('in-prenom').value = p.prenom;
        document.getElementById('in-grade').value = p.grade;
        document.getElementById('in-mat').value = p.id;
        document.getElementById('in-spec').value = p.spec;
        document.getElementById('in-pos').value = p.pos;
        document.getElementById('in-nPhys').value = p.nPhys;
        document.getElementById('in-nIntel').value = p.nIntel;
        document.getElementById('in-nMor').value = p.nMor;
        document.getElementById('in-nTir').value = p.nTir;
        updateChart(p);
    }

    let editEnabled = false;
    function toggleEditMode() {
        editEnabled = !editEnabled;
        const inputs = document.querySelectorAll('input, select');
        const btn = document.getElementById('editBtn');
        
        inputs.forEach(inp => {
            if (inp.id !== "in-mat") inp.disabled = !editEnabled;
        });

        if (editEnabled) {
            btn.innerText = "SAUVEGARDER";
            btn.style.background = var(--success);
        } else {
            btn.innerText = "MODIFIER";
            btn.style.background = var(--army-green);
            alert("Modifications enregistrées dans la base de données locale.");
        }
    }

    function updateChart(p) {
        const ctx = document.getElementById('radarStats').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Physique', 'Intellect', 'Morale', 'Tir'],
                datasets: [{
                    label: 'Aptitudes',
                    data: [p.nPhys, p.nIntel, p.nMor, p.nTir],
                    backgroundColor: 'rgba(197, 160, 89, 0.4)',
                    borderColor: '#c5a059',
                    pointBackgroundColor: '#2d3e2d'
                }]
            },
            options: { scales: { r: { min: 0, max: 22 } } }
        });
    }

    function switchSection(id) {
        // Logique simple pour scroller ou masquer les sections
        document.getElementById('sec-' + id).scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
