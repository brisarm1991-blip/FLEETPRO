<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AGC v5.0 - Gestion Intégrée CI BA 301</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --army: #2d3e2d; --gold: #c5a059; --light: #f4f4f4; --dark: #1a1a1a; --edit: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--army); color: white; display: flex; flex-direction: column; z-index: 100; }
        .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-item:hover, .nav-item.active { background: var(--gold); color: var(--army); font-weight: bold; }
        
        /* CONTENT */
        .content { flex: 1; padding: 20px; overflow-y: auto; position: relative; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        
        /* ADMIN EDIT STYLES */
        .edit-mode input, .edit-mode select { border: 2px solid var(--edit) !important; background: #fffcf5; }
        .admin-badge { background: var(--edit); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; float: right; }
        
        /* PHOTO UI */
        .photo-container { width: 150px; height: 180px; border: 2px dashed var(--gold); display: flex; align-items: center; justify-content: center; overflow: hidden; background: #eee; position: relative; }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        /* GRID & FORM */
        .grid-db { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .field { margin-bottom: 10px; }
        .field label { font-size: 0.75rem; color: #666; font-weight: bold; display: block; }
        .field input, .field select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-save { background: var(--army); color: white; }
        .btn-edit { background: var(--edit); color: white; }
        
        #auth-screen { position: fixed; inset: 0; background: var(--army); z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div style="background: var(--dark); padding: 40px; border-radius: 12px; border: 1px solid var(--gold); width: 320px; text-align: center;">
        <h2 style="color:var(--gold)">CI BA 301</h2>
        <input type="text" id="loginId" placeholder="Matricule / 'admin'" style="width:100%; padding:10px; margin-bottom:10px">
        <input type="password" id="loginPw" placeholder="Code secret" style="width:100%; padding:10px">
        <button class="btn btn-save" style="width:100%; margin-top:20px" onclick="login()">CONNEXION</button>
    </div>
</div>

<div class="sidebar">
    <div style="padding:20px; text-align:center; border-bottom: 1px solid var(--gold)">
        <h3 id="displayUser">NOM UTILISATEUR</h3>
        <span id="roleBadge">Visiteur</span>
    </div>
    <div class="nav-item active" onclick="showSec('sec-perso')">👤 PERSO / RH</div>
    <div class="nav-item" onclick="showSec('sec-med')">🏥 MÉDICAL</div>
    <div class="nav-item" onclick="showSec('sec-eval')">🎯 ÉVALUATION</div>
    <div class="nav-item admin-only" onclick="showSec('sec-admin')">⚙️ GESTION BASE</div>
    <div class="nav-item" onclick="location.reload()" style="margin-top:auto">🚪 QUITTER</div>
</div>

<div class="content">
    <div class="card admin-only" style="background: #f0f4f0;">
        <label><b>Sélectionner un Militaire :</b></label>
        <select id="masterSelect" onchange="loadProfile(this.value)" style="width:300px; padding:8px; margin-left:10px"></select>
        <button class="btn btn-edit" id="btnToggleEdit" onclick="toggleEdit()">✏️ MODIFIER LA FICHE</button>
    </div>

    <div id="sec-perso" class="section active">
        <div class="card">
            <div style="display:flex; gap:20px">
                <div class="photo-area">
                    <div class="photo-container" id="photoView">📸 Photo</div>
                    <input type="file" id="photoUpload" class="admin-only" style="display:none" onchange="handlePhoto(this)">
                    <button class="btn-edit admin-only" style="width:100%; font-size:0.7rem" onclick="document.getElementById('photoUpload').click()">CHANGER PHOTO</button>
                </div>
                <div style="flex:1">
                    <h2>Informations Personnelles</h2>
                    <div class="grid-db" id="form-perso">
                        <div class="field"><label>NOM</label><input type="text" data-key="nom"></div>
                        <div class="field"><label>PRÉNOM</label><input type="text" data-key="prenom"></div>
                        <div class="field"><label>MATRICULE</label><input type="text" data-key="mat"></div>
                        <div class="field"><label>GRADE</label><input type="text" data-key="grade"></div>
                        <div class="field"><label>DATE NAISSANCE</label><input type="date" data-key="dn"></div>
                        <div class="field"><label>LIEU NAISSANCE</label><input type="text" data-key="ln"></div>
                        <div class="field"><label>DIPLÔME CIVIL</label><input type="text" data-key="dipc"></div>
                        <div class="field"><label>DIPLÔME MILITAIRE</label><input type="text" data-key="dipm"></div>
                        <div class="field"><label>SPÉCIALITÉ</label><input type="text" data-key="spec"></div>
                        <div class="field"><label>POSITION</label><input type="text" data-key="pos"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="sec-med" class="section">
        <div class="card">
            <h2>Suivi Médical <span class="admin-badge admin-only">Admin : Saisir ici</span></h2>
            <div class="grid-db" id="form-med">
                <div class="field"><label>POIDS (Kg)</label><input type="number" data-key="poids" oninput="calcIMC()"></div>
                <div class="field"><label>TAILLE (m)</label><input type="number" step="0.01" data-key="taille" oninput="calcIMC()"></div>
                <div class="field"><label>IMC</label><input type="text" id="imcDisplay" disabled></div>
                <div class="field"><label>TENSION (TA)</label><input type="text" data-key="ta"></div>
                <div class="field"><label>GLYCÉMIE</label><input type="text" data-key="gly"></div>
                <div class="field"><label>POULS</label><input type="number" data-key="pouls"></div>
            </div>
        </div>
    </div>

    <div id="sec-eval" class="section">
        <div style="display:flex; gap:20px">
            <div class="card" style="flex:1">
                <h2>Notes d'Évaluation</h2>
                <div class="grid-db" id="form-eval">
                    <div class="field"><label>VALEUR PHYSIQUE (COVAPI/MARCO)</label><input type="number" step="0.1" data-key="nPhys"></div>
                    <div class="field"><label>VALEUR INTELLECTUELLE</label><input type="number" step="0.1" data-key="nIntel"></div>
                    <div class="field"><label>VALEUR COMME TIREUR (ISTC)</label><input type="number" step="0.1" data-key="nTir"></div>
                    <div class="field"><label>NOTE MORALE / DISCIPLINE</label><input type="number" step="0.1" data-key="nMor"></div>
                </div>
            </div>
            <div class="card" style="width:350px">
                <canvas id="radarChart"></canvas>
            </div>
        </div>
    </div>

    <div id="sec-admin" class="section">
        <div class="card" style="border: 2px solid var(--army)">
            <h2>Enregistrer un Nouveau Militaire</h2>
            <p>Remplissez les informations et cliquez sur "Créer le profil".</p>
            <button class="btn btn-save" onclick="createNewProfile()">➕ CRÉER UN NOUVEAU PROFIL</button>
        </div>
    </div>
</div>

<script>
    // BASE DE DONNEES INITIALE (Reportée de votre Excel)
    let db = [
        { mat: "CNE001", nom: "EMAN", prenom: "ARMAND BRICE", grade: "CNE", dn: "1991-06-07", ln: "EBOLOWA", dipc: "BAC A4", dipm: "SCU", spec: "RENS", pos: "PRESENT", poids: 82, taille: 1.73, ta: "121/84", gly: "0.8", pouls: 75, nPhys: 16.2, nIntel: 15.5, nTir: 18, nMor: 19, photo: null },
        { mat: "A15/26261", nom: "EBOK", prenom: "JEAN TOURAINE", grade: "CAL", dn: "1995-09-08", ln: "BERTOUA", dipc: "BAC D", dipm: "CAT1", spec: "FUSAIR", pos: "PRESENT", poids: 75, taille: 1.78, ta: "120/80", gly: "0.7", pouls: 68, nPhys: 14.5, nIntel: 12, nTir: 17, nMor: 15, photo: null }
    ];

    let currentSession = null;
    let selectedMat = null;
    let isEditMode = false;
    let chart = null;

    function login() {
        const id = document.getElementById('loginId').value;
        const pw = document.getElementById('loginPw').value;

        if(id === 'admin' && pw === '301') {
            currentSession = { role: 'admin', nom: 'ADMINISTRATEUR' };
        } else {
            const user = db.find(u => u.mat === id);
            if(user && pw === '1234') {
                currentSession = { role: 'visitor', ...user };
            } else {
                alert("Erreur: Admin (admin/301) ou Visiteur (Matricule/1234)"); return;
            }
        }
        document.getElementById('auth-screen').style.display = 'none';
        initApp();
    }

    function initApp() {
        document.getElementById('displayUser').innerText = currentSession.nom;
        document.getElementById('roleBadge').innerText = currentSession.role.toUpperCase();
        
        if(currentSession.role !== 'admin') {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            loadProfile(currentSession.mat);
        } else {
            refreshMasterSelect();
            loadProfile(db[0].mat);
        }
        disableFields(true);
    }

    function refreshMasterSelect() {
        const sel = document.getElementById('masterSelect');
        sel.innerHTML = db.map(p => `<option value="${p.mat}">${p.grade} ${p.nom} (${p.mat})</option>`).join('');
    }

    function loadProfile(mat) {
        selectedMat = mat;
        const p = db.find(u => u.mat === mat);
        
        // Remplissage automatique des champs via data-key
        document.querySelectorAll('input[data-key]').forEach(input => {
            const key = input.getAttribute('data-key');
            input.value = p[key] || "";
        });

        // Photo
        const pv = document.getElementById('photoView');
        pv.innerHTML = p.photo ? `<img src="${p.photo}">` : "📸 Photo";

        calcIMC();
        updateChart(p);
    }

    function toggleEdit() {
        if(!isEditMode) {
            isEditMode = true;
            disableFields(false);
            document.getElementById('btnToggleEdit').innerText = "💾 ENREGISTRER LES MODIFICATIONS";
            document.getElementById('btnToggleEdit').style.background = "var(--army)";
            document.body.classList.add('edit-mode');
        } else {
            saveData();
            isEditMode = false;
            disableFields(true);
            document.getElementById('btnToggleEdit').innerText = "✏️ MODIFIER LA FICHE";
            document.getElementById('btnToggleEdit').style.background = "var(--edit)";
            document.body.classList.remove('edit-mode');
        }
    }

    function disableFields(status) {
        document.querySelectorAll('input[data-key]').forEach(input => input.disabled = status);
    }

    function saveData() {
        const p = db.find(u => u.mat === selectedMat);
        document.querySelectorAll('input[data-key]').forEach(input => {
            const key = input.getAttribute('data-key');
            p[key] = isNaN(input.value) ? input.value : Number(input.value);
        });
        updateChart(p);
        alert("Fiche mise à jour avec succès.");
    }

    function handlePhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Simulation de compression (on pourrait utiliser un canvas ici)
                const p = db.find(u => u.mat === selectedMat);
                p.photo = e.target.result;
                document.getElementById('photoView').innerHTML = `<img src="${p.photo}">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function createNewProfile() {
        const newMat = "NEW-" + Math.floor(Math.random()*1000);
        const newPers = { mat: newMat, nom: "NOUVEAU", prenom: "MILITAIRE", grade: "-", nPhys:0, nIntel:0, nTir:0, nMor:0 };
        db.push(newPers);
        refreshMasterSelect();
        document.getElementById('masterSelect').value = newMat;
        loadProfile(newMat);
        showSec('sec-perso');
        toggleEdit(); // Passer direct en mode édition
    }

    function calcIMC() {
        const poids = document.querySelector('[data-key="poids"]').value;
        const taille = document.querySelector('[data-key="taille"]').value;
        if(poids && taille) {
            const imc = (poids / (taille * taille)).toFixed(1);
            const el = document.getElementById('imcDisplay');
            el.value = imc;
            el.style.color = (imc > 25) ? 'red' : 'green';
        }
    }

    function updateChart(p) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Physique', 'Intellectuel', 'Tir', 'Moral'],
                datasets: [{
                    label: 'Profil',
                    data: [p.nPhys, p.nIntel, p.nTir, p.nMor],
                    backgroundColor: 'rgba(197,160,89,0.3)',
                    borderColor: '#c5a059',
                    borderWidth: 2
                }]
            },
            options: { scales: { r: { min: 0, max: 20 } } }
        });
    }

    function showSec(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
