<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AGC v6.0 - Base de Données Intégrale CI BA 301</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --army: #2d3e2d; --gold: #c5a059; --light: #f4f4f4; --edit: #e67e22; --danger: #c0392b; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: var(--army); color: white; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); background: rgba(0,0,0,0.2); }
        .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: var(--gold); color: var(--army); font-weight: bold; }

        /* Main Content */
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .admin-bar { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Formulaire */
        .grid-db { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .field { margin-bottom: 10px; }
        .field label { font-size: 0.75rem; color: #666; font-weight: bold; display: block; text-transform: uppercase; margin-bottom: 5px; }
        .field input, .field select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* Mode Edition */
        .edit-mode input, .edit-mode select { border: 2px solid var(--edit); background: #fffcf5; }
        
        /* Photo */
        .photo-box { width: 150px; height: 180px; border: 2px solid var(--army); background: #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: var(--edit); color: white; }
        .btn-save { background: #27ae60; color: white; }
        .btn-new { background: #3498db; color: white; }
        
        #auth-screen { position: fixed; inset: 0; background: var(--army); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div style="background: #1a1a1a; padding: 40px; border-radius: 12px; text-align: center; color: white; border: 1px solid var(--gold);">
        <h2 style="color:var(--gold)">CONNEXION CI BA 301</h2>
        <input type="password" id="pw" placeholder="Code Accès" style="padding:10px; width:200px; margin:20px 0; display:block;">
        <button class="btn" style="background:var(--gold); width:100%" onclick="login()">VALIDER</button>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header"><h3>GESTION PERSONNELS</h3></div>
    <div class="nav-item active" onclick="showTab('tab-rh')">👤 FICHE INDIVIDUELLE</div>
    <div class="nav-item" onclick="showTab('tab-med')">🏥 SUIVI MÉDICAL</div>
    <div class="nav-item" onclick="showTab('tab-eval')">📊 PERFORMANCES</div>
    <div style="margin-top: auto; padding: 20px;">
        <button class="btn" style="background:var(--danger); color:white; width:100%" onclick="resetAll()">⚠️ RESET BASE</button>
    </div>
</div>

<div class="content">
    <div class="admin-bar">
        <label><strong>PERSONNEL :</strong></label>
        <select id="masterSelect" onchange="switchUser(this.value)" style="flex:1; padding:8px;"></select>
        <button class="btn btn-new" onclick="addUser()">➕ NOUVEAU</button>
        <button class="btn btn-edit" id="editBtn" onclick="toggleMode()">✏️ MODIFIER</button>
    </div>

    <div id="tab-rh" class="tab-content">
        <div class="card">
            <div style="display:flex; gap:20px">
                <div style="text-align:center">
                    <div class="photo-box" id="photoDisp">📸</div>
                    <input type="file" id="fileInp" style="display:none" onchange="savePhoto(this)">
                    <button class="btn" style="font-size:0.7rem; margin-top:5px;" onclick="document.getElementById('fileInp').click()">CHANGER PHOTO</button>
                </div>
                <div style="flex:1" class="grid-db">
                    <div class="field"><label>Nom</label><input type="text" data-field="nom"></div>
                    <div class="field"><label>Prénom</label><input type="text" data-field="prenom"></div>
                    <div class="field"><label>Grade</label><input type="text" data-field="grade"></div>
                    <div class="field"><label>Matricule</label><input type="text" data-field="mat" disabled></div>
                    <div class="field"><label>Position</label><select data-field="pos">
                        <option value="PRESENT">PRESENT</option>
                        <option value="STAGE">STAGE</option>
                        <option value="MISSION">MISSION</option>
                        <option value="MALADE">MALADE</option>
                        <option value="PERM">PERMISSION</option>
                    </select></div>
                    <div class="field"><label>Spécialité</label><input type="text" data-field="spec"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-med" class="tab-content" style="display:none">
        <div class="card">
            <div class="grid-db">
                <div class="field"><label>Poids (kg)</label><input type="number" data-field="poids"></div>
                <div class="field"><label>Taille (m)</label><input type="number" step="0.01" data-field="taille"></div>
                <div class="field"><label>Tension (TA)</label><input type="text" data-field="ta"></div>
                <div class="field"><label>Glycémie</label><input type="text" data-field="gly"></div>
            </div>
        </div>
    </div>

    <div id="tab-eval" class="tab-content" style="display:none">
        <div class="card">
            <div class="grid-db">
                <div class="field"><label>Note Physique /20</label><input type="number" step="0.1" data-field="nPhys"></div>
                <div class="field"><label>Note Morale /20</label><input type="number" step="0.1" data-field="nMor"></div>
                <div class="field"><label>Note Intel /20</label><input type="number" step="0.1" data-field="nIntel"></div>
                <div class="field"><label>Note Tir /20</label><input type="number" step="0.1" data-field="nTir"></div>
            </div>
            <div style="width: 100%; height: 300px; margin-top: 20px;">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // BASE DE DONNÉES INITIALE (Extraite de vos fichiers)
    const rawData = [
        { mat:"CNE-01", nom:"BALOGOG", prenom:"PATRICK", grade:"CNE", pos:"STAGE", spec:"LOG", poids:85, taille:1.75, ta:"", nPhys:11.7, nMor:20.4, nIntel:13, nTir:17 },
        { mat:"CNE-02", nom:"EMAN", prenom:"ARMAND BRICE", grade:"CNE", pos:"PRESENT", spec:"RENS", poids:82, taille:1.73, ta:"121/84", nPhys:16.2, nMor:20.6, nIntel:18, nTir:18 },
        { mat:"A15/26261", nom:"EBOK", prenom:"JEAN TOURAINE", grade:"CAL", pos:"PRESENT", spec:"FUSAIR", poids:0, taille:0, ta:"0", nPhys:14.5, nMor:21, nIntel:12, nTir:20 },
        { mat:"A24/57038", nom:"MBIA ZANGA", prenom:"AMELIE VICKY", grade:"2°CL", pos:"PRESENT", spec:"FUSAIR", poids:0, taille:0, ta:"0", nPhys:0, nMor:20.6, nIntel:13, nTir:15 }
        // Les 44 autres peuvent être ajoutés via le bouton "NOUVEAU" ou injectés ici.
    ];

    let db = JSON.parse(localStorage.getItem('ci_database')) || rawData;
    let currentMat = db[0].mat;
    let isEdit = false;
    let myChart = null;

    function login() {
        if(document.getElementById('pw').value === '301') {
            document.getElementById('auth-screen').style.display = 'none';
            init();
        } else { alert("Code Incorrect"); }
    }

    function init() {
        updateSelect();
        switchUser(currentMat);
        lockFields(true);
    }

    function updateSelect() {
        const sel = document.getElementById('masterSelect');
        sel.innerHTML = db.map(p => `<option value="${p.mat}">${p.grade} ${p.nom} - ${p.mat}</option>`).join('');
        sel.value = currentMat;
    }

    function switchUser(mat) {
        currentMat = mat;
        const p = db.find(x => x.mat === mat);
        document.querySelectorAll('[data-field]').forEach(inp => {
            const key = inp.getAttribute('data-field');
            inp.value = p[key] || "";
        });
        
        const photoBox = document.getElementById('photoDisp');
        photoBox.innerHTML = p.photo ? `<img src="${p.photo}">` : "📸";
        drawChart(p);
    }

    function toggleMode() {
        isEdit = !isEdit;
        const btn = document.getElementById('editBtn');
        if(isEdit) {
            lockFields(false);
            btn.innerText = "💾 ENREGISTRER";
            btn.className = "btn btn-save";
            document.body.classList.add('edit-mode');
        } else {
            saveCurrent();
            lockFields(true);
            btn.innerText = "✏️ MODIFIER";
            btn.className = "btn btn-edit";
            document.body.classList.remove('edit-mode');
        }
    }

    function saveCurrent() {
        const idx = db.findIndex(x => x.mat === currentMat);
        document.querySelectorAll('[data-field]').forEach(inp => {
            const key = inp.getAttribute('data-field');
            db[idx][key] = isNaN(inp.value) || inp.value === "" ? inp.value : Number(inp.value);
        });
        localStorage.setItem('ci_database', JSON.stringify(db));
        updateSelect();
        drawChart(db[idx]);
        alert("Enregistré avec succès !");
    }

    function savePhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const idx = db.findIndex(x => x.mat === currentMat);
                db[idx].photo = e.target.result; // Conversion en Base64
                document.getElementById('photoDisp').innerHTML = `<img src="${e.target.result}">`;
                localStorage.setItem('ci_database', JSON.stringify(db)); // Sauvegarde immédiate
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function addUser() {
        const m = prompt("Nouveau Matricule :");
        if(!m) return;
        if(db.some(x => x.mat === m)) return alert("Existe déjà !");
        
        const n = { mat: m, nom: "NOUVEAU", grade: "2°CL", pos: "PRESENT", nPhys:0, nMor:20, nIntel:0, nTir:0 };
        db.push(n);
        localStorage.setItem('ci_database', JSON.stringify(db));
        updateSelect();
        switchUser(m);
        if(!isEdit) toggleMode();
    }

    function lockFields(status) {
        document.querySelectorAll('[data-field]').forEach(inp => {
            if(inp.getAttribute('data-field') !== 'mat') inp.disabled = status;
        });
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    function drawChart(p) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Physique', 'Moral', 'Intellect', 'Tir'],
                datasets: [{
                    label: 'Profil Aptitude',
                    data: [p.nPhys, p.nMor, p.nIntel, p.nTir],
                    backgroundColor: 'rgba(197, 160, 89, 0.4)',
                    borderColor: '#c5a059',
                    pointBackgroundColor: '#2d3e2d'
                }]
            },
            options: { scales: { r: { min: 0, max: 20 } }, maintainAspectRatio: false }
        });
    }

    function resetAll() {
        if(confirm("Attention : Cela effacera toutes vos photos et modifications. Continuer ?")) {
            localStorage.removeItem('ci_database');
            location.reload();
        }
    }
</script>
</body>
</html>
