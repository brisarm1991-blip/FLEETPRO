<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AGC v3.0 - Système Intégré CI BA 301</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --army: #2d3e2d; --gold: #c5a059; --danger: #e74c3c; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; height: 100vh; }
        
        /* LOGIN SYSTEM */
        #auth-screen { position: fixed; inset: 0; background: var(--army); z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; }
        .auth-card { background: #1a1a1a; padding: 40px; border-radius: 12px; border: 1px solid var(--gold); width: 350px; text-align: center; }
        
        /* LAYOUT */
        .sidebar { width: 260px; background: var(--army); color: white; display: flex; flex-direction: column; }
        .main { flex: 1; padding: 25px; overflow-y: auto; }
        .nav-link { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-link:hover, .active-nav { background: var(--gold); color: var(--army); font-weight: bold; }
        
        /* COMPONENTS */
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .grid-admin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; font-size: 0.9rem; }
        th { background: #f4f4f4; }
        
        .admin-controls { background: #fff3cd; border-left: 5px solid #ffc107; padding: 15px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-save { background: var(--army); color: white; }
        .btn-view { background: var(--gold); color: white; }
        
        .hidden { display: none; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h2 style="color:var(--gold)">CONNEXION AGC</h2>
        <input type="text" id="loginUser" placeholder="Matricule ou 'admin'" style="width:100%; padding:10px; margin-bottom:10px">
        <input type="password" id="loginPass" placeholder="Code secret" style="width:100%; padding:10px; margin-bottom:20px">
        <button class="btn btn-save" style="width:100%" onclick="handleLogin()">SE CONNECTER</button>
    </div>
</div>

<div class="sidebar">
    <div style="padding:25px; border-bottom: 2px solid var(--gold)">
        <div style="font-size:1.2rem; font-weight:bold">CI BA 301</div>
        <div id="userDisplay" style="font-size:0.8rem; color:var(--gold)">-</div>
    </div>
    <div class="nav-link active-nav" onclick="showSec('sec-dash')">🏠 TABLEAU DE BORD</div>
    <div class="nav-link admin-only" onclick="showSec('sec-admin')">⚙️ PARAMÈTRES ADMIN</div>
    <div class="nav-link" onclick="logout()" style="margin-top:auto; background:rgba(0,0,0,0.2)">🚪 DÉCONNEXION</div>
</div>

<div class="main">
    
    <div id="sec-dash" class="section">
        <div id="admin-selector" class="admin-only card hidden">
            <h3>Sélectionner un Militaire pour voir sa fiche :</h3>
            <select id="selectMilitaire" onchange="loadIndividualSheet(this.value)" style="padding:10px; width:300px"></select>
        </div>

        <div id="fiche-individuelle" class="card">
            <div style="display:flex; gap:30px">
                <div style="flex:1">
                    <h2 id="f-nom" style="color:var(--army)">-</h2>
                    <p><strong>Grade :</strong> <span id="f-grade">-</span> | <strong>Matricule :</strong> <span id="f-mat">-</span></p>
                    <hr>
                    <div class="grid-admin">
                        <div><label>Position :</label> <div id="f-pos">-</div></div>
                        <div><label>IMC :</label> <div id="f-imc">-</div></div>
                        <div><label>Tension :</label> <div id="f-ta">-</div></div>
                    </div>
                </div>
                <div style="width:350px; height:350px;">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div id="sec-admin" class="section hidden">
        <div class="card">
            <h3>Insertion / Modification des Données</h3>
            <div class="grid-admin">
                <input type="text" id="inNom" placeholder="NOM">
                <input type="text" id="inPrenom" placeholder="Prénom">
                <input type="text" id="inGrade" placeholder="Grade">
                <input type="text" id="inMat" placeholder="Matricule">
                <input type="number" id="inTir" placeholder="Note Tir /20">
                <input type="number" id="inSport" placeholder="Note Sport /20">
                <input type="number" id="inTopo" placeholder="Note Topo /20">
                <input type="number" id="inCombat" placeholder="Note Combat /20">
                <input type="number" id="inRdg" placeholder="Note RDG /20">
            </div>
            <button class="btn btn-save" style="margin-top:15px" onclick="saveNewData()">ENREGISTRER LES DONNÉES</button>
        </div>

        <div class="card">
            <h3>Liste Globale du Personnel</h3>
            <table id="tableMain">
                <thead>
                    <tr><th>Nom</th><th>Matricule</th><th>Position</th><th>Moyenne</th><th>Actions</th></tr>
                </thead>
                <tbody id="tbodyMain"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    // BASE DE DONNEES INITIALE
    let db = [
        { id: "A15/26261", nom: "EBOK", prenom: "JEAN", grade: "CAL", mat: "A15/26261", pos: "PRESENT", tir: 18, sport: 14, topo: 12, combat: 15, rdg: 16, poids: 75, taille: 1.75, ta: "12/8" },
        { id: "CNE001", nom: "EMAN", prenom: "ARMAND BRICE", grade: "CNE", mat: "CNE001", pos: "PRESENT", tir: 19, sport: 17, topo: 15, combat: 18, rdg: 19, poids: 82, taille: 1.73, ta: "12/8" }
    ];

    let currentUser = null;
    let radarChart = null;

    function handleLogin() {
        const user = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;

        if (user === 'admin' && pass === '301') {
            currentUser = { role: 'admin', nom: 'ADMINISTRATEUR' };
        } else {
            const found = db.find(u => u.mat === user);
            if (found && pass === '1234') {
                currentUser = { role: 'visitor', ...found };
            } else {
                alert("Identifiants incorrects (Visiteur: Matricule / 1234)");
                return;
            }
        }
        
        document.getElementById('auth-screen').style.display = 'none';
        initApp();
    }

    function initApp() {
        document.getElementById('userDisplay').innerText = currentUser.nom;
        
        if (currentUser.role === 'admin') {
            document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
            populateSelect();
            refreshTable();
            loadIndividualSheet(db[0].mat); // Par défaut sur le premier
        } else {
            document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
            loadIndividualSheet(currentUser.mat);
        }
    }

    function populateSelect() {
        const sel = document.getElementById('selectMilitaire');
        sel.innerHTML = db.map(p => `<option value="${p.mat}">${p.nom} ${p.prenom}</option>`).join('');
    }

    function loadIndividualSheet(mat) {
        const p = db.find(u => u.mat === mat);
        document.getElementById('f-nom').innerText = `${p.nom} ${p.prenom}`;
        document.getElementById('f-grade').innerText = p.grade;
        document.getElementById('f-mat').innerText = p.mat;
        document.getElementById('f-pos').innerText = p.pos;
        document.getElementById('f-imc').innerText = (p.poids / (p.taille**2)).toFixed(1);
        document.getElementById('f-ta').innerText = p.ta;

        updateRadar(p);
    }

    function updateRadar(p) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (radarChart) radarChart.destroy();
        
        radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Tir', 'Sport', 'Topographie', 'Combat', 'Règlements'],
                datasets: [{
                    label: 'Forces / Faiblesses',
                    data: [p.tir, p.sport, p.topo, p.combat, p.rdg],
                    backgroundColor: 'rgba(197, 160, 89, 0.2)',
                    borderColor: '#c5a059',
                    pointBackgroundColor: '#2d3e2d'
                }]
            },
            options: { 
                scales: { r: { min: 0, max: 20 } },
                maintainAspectRatio: false 
            }
        });
    }

    function saveNewData() {
        const n = {
            id: document.getElementById('inMat').value,
            nom: document.getElementById('inNom').value.toUpperCase(),
            prenom: document.getElementById('inPrenom').value.toUpperCase(),
            grade: document.getElementById('inGrade').value,
            mat: document.getElementById('inMat').value,
            pos: "PRESENT",
            tir: Number(document.getElementById('inTir').value),
            sport: Number(document.getElementById('inSport').value),
            topo: Number(document.getElementById('inTopo').value),
            combat: Number(document.getElementById('inCombat').value),
            rdg: Number(document.getElementById('inRdg').value),
            poids: 70, taille: 1.75, ta: "12/7"
        };
        db.push(n);
        populateSelect();
        refreshTable();
        alert("Données enregistrées !");
    }

    function refreshTable() {
        const body = document.getElementById('tbodyMain');
        body.innerHTML = db.map(p => `
            <tr>
                <td>${p.nom}</td><td>${p.mat}</td><td>${p.pos}</td>
                <td><b>${((p.tir+p.sport+p.topo+p.combat+p.rdg)/5).toFixed(2)}</b></td>
                <td><button class="btn btn-view" onclick="showSec('sec-dash'); loadIndividualSheet('${p.mat}')">Voir Fiche</button></td>
            </tr>
        `).join('');
    }

    function showSec(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active-nav'));
        event.currentTarget.classList.add('active-nav');
    }

    function logout() { location.reload(); }
</script>

</body>
</html>
