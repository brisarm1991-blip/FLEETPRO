<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTÈME DE GESTION INTÉGRÉ - CI BA 301</title>
    <style>
        :root {
            --army-green: #3a5a40;
            --army-dark: #1b2631;
            --gold: #b8860b;
            --danger: #e74c3c;
            --success: #27ae60;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f0f2f5; display: flex; }

        /* Barre Latérale */
        .sidebar { width: 260px; background: var(--army-dark); height: 100vh; position: fixed; color: white; padding-top: 20px; }
        .sidebar h2 { text-align: center; color: var(--gold); font-size: 1.2rem; border-bottom: 1px solid #34495e; padding-bottom: 15px; }
        .menu-item { padding: 15px 25px; cursor: pointer; border-left: 4px solid transparent; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background: #2c3e50; border-left-color: var(--gold); }

        /* Contenu Principal */
        .main { margin-left: 260px; flex: 1; padding: 30px; }
        .header-bar { background: white; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Cartes de Personnel */
        .grid-personnel { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid var(--army-green); }
        .card-header { padding: 15px; background: #f8f9fa; display: flex; align-items: center; gap: 15px; }
        .photo-placeholder { width: 60px; height: 60px; border-radius: 50%; background: #ddd; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .card-body { padding: 15px; font-size: 0.9rem; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 3px; }
        .label { color: #7f8c8d; font-weight: bold; }
        .valeur { color: var(--army-dark); font-weight: bold; }

        /* Indicateurs */
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; }
        .badge-present { background: #d4edda; color: #155724; }
        .badge-mission { background: #fff3cd; color: #856404; }
        .badge-alerte { background: #f8d7da; color: #721c24; }

        .section { display: none; }
        .section.active { display: block; }
        
        input[type="text"] { padding: 10px; width: 300px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>UNITÉ CI - BA 301</h2>
    <div class="menu-item active" onclick="showSection('global')">📋 Personnel Complet</div>
    <div class="menu-item" onclick="showSection('perf')">🎯 Performance & Tir</div>
    <div class="menu-item" onclick="showSection('sante')">🏥 Suivi Biométrique</div>
    <div class="menu-item" onclick="showSection('ops')">🌍 Opérations / Missions</div>
</div>

<div class="main">
    <div class="header-bar">
        <input type="text" id="searchInput" placeholder="Rechercher un militaire..." onkeyup="filterCards()">
        <div id="stats-unite">Effectif total: <span id="count">0</span></div>
    </div>

    <div id="global" class="section active">
        <div class="grid-personnel" id="personnelGrid">
            </div>
    </div>

    <div id="perf" class="section">
        <div class="card" style="width: 100%;">
            <div class="card-body">
                <h3>Classement Performance (Sport & Tir)</h3>
                <p>Données consolidées des fichiers EVALUATION et ISTC.</p>
                <div id="perfContent"></div>
            </div>
        </div>
    </div>

    </div>

<script>
    // 1. BASE DE DONNÉES CONSOLIDÉE (Synthèse de tous vos fichiers CSV)
    // Ici, nous intégrons les colonnes exactes de vos fichiers
    const effectif = [
        {
            nom: "EMAN", prenom: "ARMAND BRICE", grade: "CNE", mat: "-", 
            dn: "1991-06-07", dipM: "SCU", spec: "RENS", pos: "PRESENT",
            poids: 82, taille: 1.73, ta: "121/84", gly: "0.8",
            sport: 16.20, tir: 18, topo: 15, combat: 16, moral: 20.6,
            mission: "RAS", imc: 27.4
        },
        {
            nom: "BALOGOG", prenom: "PATRICK", grade: "CNE", mat: "-", 
            dn: "1989-06-27", dipM: "SCU", spec: "LOG", pos: "STAGE",
            poids: 85, taille: 1.75, ta: "0", gly: "0",
            sport: 11.71, tir: 17, topo: 14, combat: 10, moral: 20.4,
            mission: "STAGE", imc: 27.7
        },
        {
            nom: "EBOK", prenom: "JEAN TOURAINE", grade: "CAL", mat: "A15/26261", 
            dn: "1995-09-08", dipM: "CAT1", spec: "FUSAIR", pos: "PRESENT",
            poids: 68, taille: 1.75, ta: "0", gly: "0",
            sport: 15.00, tir: 20, topo: 14, combat: 15, moral: 21.1,
            mission: "RAS", imc: 22.2
        },
        {
            nom: "BELBARA", prenom: "DJAKDJINKREO", grade: "2°CL", mat: "A24/58635", 
            dn: "2001-05-12", dipM: "FES AIR", spec: "FUSAIR", pos: "PRESENT",
            poids: 72, taille: 1.70, ta: "110/70", gly: "0.9",
            sport: 12.5, tir: 15, topo: 11, combat: 12, moral: 21.0,
            mission: "RAS", imc: 24.9
        }
        // Ajoutez ici les autres membres en suivant le même format
    ];

    function renderCards() {
        const grid = document.getElementById('personnelGrid');
        grid.innerHTML = '';
        document.getElementById('count').innerText = effectif.length;

        effectif.forEach(p => {
            const badgeClass = p.pos === 'PRESENT' ? 'badge-present' : 'badge-mission';
            const imcColor = p.imc > 25 ? 'color:red' : 'color:green';

            grid.innerHTML += `
                <div class="card" data-name="${p.nom} ${p.prenom}">
                    <div class="card-header">
                        <div class="photo-placeholder">${p.nom[0]}${p.prenom[0]}</div>
                        <div>
                            <div style="font-weight:bold; font-size:1.1rem">${p.grade} ${p.nom}</div>
                            <span class="badge ${badgeClass}">${p.pos}</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="stat-row"><span class="label">Matricule:</span><span class="valeur">${p.mat}</span></div>
                        <div class="stat-row"><span class="label">Spécialité:</span><span class="valeur">${p.spec}</span></div>
                        <div class="stat-row"><span class="label">Diplôme Mil:</span><span class="valeur">${p.dipM}</span></div>
                        <hr>
                        <div class="stat-row"><span class="label">Note Sport:</span><span class="valeur">${p.sport}/20</span></div>
                        <div class="stat-row"><span class="label">Note Tir:</span><span class="valeur" style="color:blue">${p.tir}/20</span></div>
                        <div class="stat-row"><span class="label">Moral:</span><span class="valeur">${p.moral}</span></div>
                        <hr>
                        <div class="stat-row"><span class="label">Santé (IMC):</span><span class="valeur" style="${imcColor}">${p.imc}</span></div>
                        <div class="stat-row"><span class="label">Tension (TA):</span><span class="valeur">${p.ta}</span></div>
                    </div>
                </div>
            `;
        });
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function filterCards() {
        let input = document.getElementById('searchInput').value.toUpperCase();
        let cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            let name = card.getAttribute('data-name');
            card.style.display = name.includes(input) ? "block" : "none";
        });
    }

    window.onload = renderCards;
</script>

</body>
</html>
