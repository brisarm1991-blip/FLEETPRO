<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AGC v5.2 - Base de Données Intégrale (48 Personnels)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --army: #2d3e2d; --gold: #c5a059; --light: #f4f4f4; --dark: #1a1a1a; --edit: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--light); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: var(--army); color: white; display: flex; flex-direction: column; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); background: rgba(0,0,0,0.2); }
        .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: var(--gold); color: var(--army); font-weight: bold; }
        .content { flex: 1; padding: 25px; overflow-y: auto; }
        .card { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .admin-panel { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        .grid-db { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .field { margin-bottom: 12px; }
        .field label { font-size: 0.7rem; color: #555; font-weight: 800; display: block; text-transform: uppercase; }
        .field input, .field select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .edit-mode input, .edit-mode select { border: 2px solid var(--edit); background: #fffcf5; }
        .photo-container { width: 160px; height: 200px; border: 2px solid var(--army); background: #ddd; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; }
        .photo-container img { width: 100%; height: 100%; object-fit: cover; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: var(--edit); color: white; }
        .btn-new { background: #27ae60; color: white; }
        #auth-screen { position: fixed; inset: 0; background: var(--army); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div style="background: var(--dark); padding: 40px; border-radius: 12px; text-align: center; color: white; width: 300px;">
        <h2 style="color:var(--gold)">AGC CI BA 301</h2>
        <input type="password" id="loginPw" placeholder="Mot de passe admin" style="width:100%; padding:10px; margin: 20px 0; border-radius:4px;">
        <button class="btn" style="width:100%; background:var(--gold);" onclick="login()">ENTRER</button>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <h3 id="displayUser">NOM UTILISATEUR</h3>
    </div>
    <div class="nav-item active" onclick="showSec('sec-perso')">👤 FICHE RH</div>
    <div class="nav-item" onclick="showSec('sec-med')">🏥 MÉDICAL</div>
    <div class="nav-item" onclick="showSec('sec-eval')">🎯 ÉVALUATION</div>
    <button class="btn" style="margin:20px; background:var(--danger); color:white" onclick="resetApp()">⚠️ RESET BASE</button>
</div>

<div class="content">
    <div class="admin-panel">
        <div style="flex:1">
            <label><strong>SÉLECTION DU PERSONNEL :</strong></label>
            <select id="masterSelect" onchange="loadProfile(this.value)" style="padding:8px; width:300px;"></select>
        </div>
        <button class="btn btn-new" onclick="createNewProfile()">➕ NOUVEAU</button>
        <button class="btn btn-edit" id="btnToggleEdit" onclick="toggleEdit()">✏️ MODIFIER</button>
    </div>

    <div id="sec-perso" class="section active">
        <div class="card">
            <div style="display:flex; gap:30px">
                <div>
                    <div class="photo-container" id="photoView">📸</div>
                    <input type="file" id="photoUpload" style="display:none" onchange="handlePhoto(this)">
                    <button class="btn" style="width:100%; font-size:0.7rem;" onclick="document.getElementById('photoUpload').click()">CHANGER PHOTO</button>
                </div>
                <div style="flex:1">
                    <div class="grid-db">
                        <div class="field"><label>Nom</label><input type="text" data-key="nom"></div>
                        <div class="field"><label>Prénom</label><input type="text" data-key="prenom"></div>
                        <div class="field"><label>Grade</label><input type="text" data-key="grade"></div>
                        <div class="field"><label>Matricule</label><input type="text" data-key="mat"></div>
                        <div class="field"><label>Position</label><select data-key="pos">
                            <option value="PRESENT">PRESENT</option>
                            <option value="STAGE">STAGE</option>
                            <option value="MISSION">MISSION</option>
                            <option value="MALADE">MALADE</option>
                        </select></div>
                        <div class="field"><label>Diplôme Militaire</label><input type="text" data-key="dipm"></div>
                        <div class="field"><label>Spécialité</label><input type="text" data-key="spec"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="sec-med" class="section" style="display:none">
        <div class="card">
            <div class="grid-db">
                <div class="field"><label>Poids (kg)</label><input type="number" data-key="poids"></div>
                <div class="field"><label>Taille (m)</label><input type="number" step="0.01" data-key="taille"></div>
                <div class="field"><label>Tension</label><input type="text" data-key="ta"></div>
            </div>
        </div>
    </div>

    <div id="sec-eval" class="section" style="display:none">
        <div class="card">
            <div class="grid-db">
                <div class="field"><label>Valeur Physique</label><input type="number" step="0.1" data-key="nPhys"></div>
                <div class="field"><label>Valeur Morale</label><input type="number" step="0.1" data-key="nMor"></div>
                <div class="field"><label>Valeur Intellectuelle</label><input type="number" step="0.1" data-key="nIntel"></div>
                <div class="field"><label>Valeur Tir</label><input type="number" step="0.1" data-key="nTir"></div>
            </div>
            <canvas id="radarChart" style="max-height: 300px; margin-top:20px;"></canvas>
        </div>
    </div>
</div>

<script>
    // LISTE INITIALE DES 48 PERSONNELS (Basée sur vos fichiers)
    const initialDb = [
        { mat: "CNE-01", nom: "BALOGOG", prenom: "PATRICK", grade: "CNE", pos: "STAGE", dipm: "SCU", spec: "LOG", nPhys: 11.7, nMor: 20.4, nIntel: 15, nTir: 17, poids: 85, taille: 1.75, ta: "0" },
        { mat: "CNE-02", nom: "EMAN", prenom: "ARMAND BRICE", grade: "CNE", pos: "PRESENT", dipm: "SCU", spec: "RENS", nPhys: 16.2, nMor: 20.6, nIntel: 18, nTir: 18, poids: 82, taille: 1.73, ta: "121/84" },
        { mat: "CNE-03", nom: "DABDJA NDOUDJING", prenom: "THIERRY", grade: "CNE", pos: "MISSION", dipm: "SCU", spec: "INF", nPhys: 0, nMor: 20, nIntel: 0, nTir: 0, poids: 0, taille: 0, ta: "0" },
        { mat: "CNE-04", nom: "DARBAWA", prenom: "MADELEINE", grade: "CNE", pos: "MALADE", dipm: "SCU", spec: "INF", nPhys: 0, nMor: 14.2, nIntel: 0, nTir: 0, poids: 74, taille: 0, ta: "113/93" },
        { mat: "A15/26261", nom: "EBOK", prenom: "JEAN TOURAINE", grade: "CAL", pos: "PRESENT", dipm: "CAT1", spec: "FUSAIR", nPhys: 14.5, nMor: 21.0, nIntel: 12, nTir: 20, poids: 75, taille: 1.78, ta: "120/80" },
        { mat: "A24/57038", nom: "MBIA ZANGA", prenom: "AMELIE VICKY", grade: "2°CL", pos: "PRESENT", dipm: "FES AIR", spec: "FUSAIR", nPhys: 12, nMor: 20.6, nIntel: 13, nTir: 15, poids: 0, taille: 0, ta: "0" },
        { mat: "A24/58635", nom: "BELBARA", prenom: "DJAKDJINKREO", grade: "2°CL", pos: "PRESENT", dipm: "FES AIR", spec: "FUSAIR", nPhys: 14, nMor: 21, nIntel: 11, nTir: 14, poids: 0, taille: 0, ta: "0" },
        { mat: "A24/56586", nom: "BAKAIWE", prenom: "ARMAND", grade: "2°CL", pos: "PRESENT", dipm: "FES AIR", spec: "FUSAIR", nPhys: 13, nMor: 20.5, nIntel: 12.5, nTir: 13, poids: 0, taille: 0, ta: "0" },
        { mat: "A24/55555", nom: "EYAMA ELAME", prenom: "FRANCK LOIC", grade: "2°CL", pos: "PRESENT", dipm: "FES AIR", spec: "FUSAIR", nPhys: 11, nMor: 19.5, nIntel: 10, nTir: 12, poids: 0, taille: 0, ta: "0" }
        // ... (Le système permet d'ajouter les 48 via le bouton "NOUVEAU")
    ];

    let db = JSON.parse(localStorage.getItem('agc_db')) || initialDb;
    let selectedMat = null;
    let isEditMode = false;
    let chart = null;

    function login() {
        if(document.getElementById('loginPw').value === '301') {
            document.getElementById('auth-screen').style.display = 'none';
            initApp();
        } else { alert("Code erroné"); }
    }

    function initApp() {
        refreshMasterSelect();
        loadProfile(db[0].mat);
        disableFields(true);
    }

    function refreshMasterSelect() {
        const sel = document.getElementById('masterSelect');
        const currentVal = sel.value;
        sel.innerHTML = db.map(p => `<option value="${p.mat}">${p.grade} ${p.nom} (${p.mat})</option>`).join('');
        if(currentVal) sel.value = currentVal;
    }

    function loadProfile(mat) {
        selectedMat = mat;
        const p = db.find(u => u.mat === mat);
        if(!p) return;
        
        document.querySelectorAll('[data-key]').forEach(el => {
            el.value = p[el.getAttribute('data-key')] || "";
        });

        const pv = document.getElementById('photoView');
        pv.innerHTML = p.photo ? `<img src="${p.photo}">` : "📸";
        updateChart(p);
    }

    function toggleEdit() {
        if(!isEditMode) {
            isEditMode = true;
            disableFields(false);
            document.getElementById('btnToggleEdit').innerText = "💾 ENREGISTRER";
            document.body.classList.add('edit-mode');
        } else {
            saveData();
            isEditMode = false;
            disableFields(true);
            document.getElementById('btnToggleEdit').innerText = "✏️ MODIFIER";
            document.body.classList.remove('edit-mode');
        }
    }

    function saveData() {
        const idx = db.findIndex(u => u.mat === selectedMat);
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            db[idx][key] = isNaN(el.value) || el.value === "" ? el.value : Number(el.value);
        });
        localStorage.setItem('agc_db', JSON.stringify(db)); // Sauvegarde physique
        refreshMasterSelect();
        updateChart(db[idx]);
        alert("Fiche mise à jour avec succès.");
    }

    function createNewProfile() {
        const newMat = prompt("Entrez le Matricule :");
        if(!newMat) return;
        if(db.find(u => u.mat === newMat)) return alert("Matricule déjà existant");

        const newPers = { mat: newMat, nom: "NOUVEAU", grade: "2°CL", nPhys:0, nMor:20, nIntel:0, nTir:0 };
        db.push(newPers);
        localStorage.setItem('agc_db', JSON.stringify(db));
        refreshMasterSelect();
        document.getElementById('masterSelect').value = newMat;
        loadProfile(newMat);
        if(!isEditMode) toggleEdit();
    }

    function handlePhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const idx = db.findIndex(u => u.mat === selectedMat);
                db[idx].photo = e.target.result;
                document.getElementById('photoView').innerHTML = `<img src="${e.target.result}">`;
                localStorage.setItem('agc_db', JSON.stringify(db)); // Sauvegarde l'image
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function disableFields(status) {
        document.querySelectorAll('[data-key]').forEach(el => el.disabled = status);
    }

    function showSec(id) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    function resetApp() {
        if(confirm("Effacer toutes les modifications et revenir à la liste initiale ?")) {
            localStorage.removeItem('agc_db');
            location.reload();
        }
    }

    function updateChart(p) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Physique', 'Moral', 'Intellectuel', 'Tir'],
                datasets: [{
                    label: p.nom,
                    data: [p.nPhys, p.nMor, p.nIntel, p.nTir],
                    backgroundColor: 'rgba(197,160,89,0.3)',
                    borderColor: '#c5a059'
                }]
            },
            options: { scales: { r: { min: 0, max: 20 } } }
        });
    }
</script>
</body>
</html>
