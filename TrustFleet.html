<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DEBUG ACCÈS BA 301</title>
    <style>
        body { font-family: sans-serif; background: #2d3e2d; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; color: black; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #c5a059; border: none; font-weight: bold; cursor: pointer; }
        #interface { display: none; background: white; color: black; position: fixed; inset: 0; padding: 20px; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-card">
        <h2>CONNEXION BA 301</h2>
        <input type="text" id="code" placeholder="Code (Ex: 301)">
        <button onclick="tentativeConnexion()">ACCÉDER</button>
        <p id="msg" style="color:red; font-size:12px;"></p>
    </div>

    <div id="interface">
        <h1 style="color:#2d3e2d">✓ ACCÈS RÉUSSI</h1>
        <hr>
        <h3>LISTE DU PERSONNEL (EXTRACTION EXCEL)</h3>
        <div id="liste"></div>
        <button onclick="location.reload()" style="margin-top:20px; background:#ccc;">DÉCONNEXION</button>
    </div>

<script>
    // La base de données simplifiée pour le test
    const personnel = [
        { id: "301", nom: "ADMIN", grade: "COL" },
        { id: "OFF/001", nom: "BALOGOG", grade: "CNE" },
        { id: "OFF/002", nom: "EMAN", grade: "CNE" },
        { id: "A15/26261", nom: "EBOK", grade: "CAL" },
        { id: "A24/57038", nom: "MBIA ZANGA", grade: "2°CL" }
    ];

    function tentativeConnexion() {
        const saisie = document.getElementById('code').value.trim();
        const msg = document.getElementById('msg');
        
        // On cherche si le code existe dans la liste
        const user = personnel.find(u => u.id === saisie);

        if (user) {
            // Si trouvé, on cache le login et on montre l'interface
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('interface').style.display = 'block';
            
            // On affiche la liste des gens pour prouver que ça marche
            const divListe = document.getElementById('liste');
            divListe.innerHTML = "<ul>" + personnel.map(p => `<li>${p.grade} ${p.nom} (Matricule: ${p.id})</li>`).join('') + "</ul>";
            
            console.log("Connexion réussie pour : " + user.nom);
        } else {
            msg.innerText = "ERREUR : Matricule ou code inconnu.";
            console.log("Échec de connexion avec : " + saisie);
        }
    }
</script>

</body>
</html>
