<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 FleetManager Pro - BA 301</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary: #1a2d4a; --primary-light: #243d63; --accent: #ff6b35;
  --success: #28a745; --danger: #dc3545; --warning: #ffc107;
  --info: #17a2b8; --bg: #f0f4f8; --card-bg: #ffffff;
  --text: #2c3e50; --text-muted: #6c757d; --border: #dee2e6;
  --shadow: 0 2px 12px rgba(0,0,0,0.08); --radius: 10px; --sidebar-width: 260px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}

/* AMÉLIORATION : PRINT PDF SANS SIDEBAR */
@media print {
  .sidebar, .btn, .top-bar button, .header-actions, .action-btns { display: none !important; }
  .main-content { margin-left: 0 !important; width: 100% !important; }
  .page { display: block !important; padding: 0; }
  .table-container { box-shadow: none; border: 1px solid #ccc; }
  body { background: white; }
}

.sidebar{width:var(--sidebar-width);background:var(--primary);color:#fff;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;transition:0.3s;}
.sidebar-header{padding:25px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-nav{flex:1;padding:20px 0;overflow-y:auto;}
.nav-item{padding:12px 25px;display:flex;align-items:center;color:rgba(255,255,255,0.7);text-decoration:none;cursor:pointer;transition:0.3s;font-size:0.95rem;}
.nav-item i{width:25px;margin-right:10px;font-size:1.1rem;}
.nav-item:hover, .nav-item.active{background:var(--primary-light);color:#fff;border-left:4px solid var(--accent);}

.main-content{flex:1;margin-left:var(--sidebar-width);display:flex;flex-direction:column;transition:0.3s;}
.top-bar{height:70px;background:var(--card-bg);display:flex;align-items:center;justify-content:space-between;padding:0 30px;box-shadow:var(--shadow);position:sticky;top:0;z-index:90;}
.page{padding:30px;display:none;animation:fadeIn 0.4s;}
.page.active{display:block;}

.table-container{background:var(--card-bg);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);margin-top:20px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th{text-align:left;padding:12px 15px;background:#f8f9fa;color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:0.75rem;border-bottom:2px solid var(--border);}
td{padding:12px 15px;border-bottom:1px solid var(--border);font-size:0.9rem;}

.btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:0.2s;}
.btn-primary{background:var(--accent);color:white;}
.btn-info{background:var(--info);color:white;}

#lock-screen{position:fixed;inset:0;background:var(--primary);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;}
.lock-box{background:var(--primary-light);padding:40px;border-radius:15px;text-align:center;width:320px;}
.lock-box input{width:100%;padding:12px;margin:20px 0;border-radius:6px;border:none;text-align:center;font-size:1.2rem;}

@keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body onload="initApp()">

<div id="lock-screen">
    <div class="lock-box">
        <h2 id="lock-unit-name">BA 301</h2>
        <input type="password" id="access-code" placeholder="Code secret">
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="verifyLogin()">CONNEXION</button>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header"><h2>FLEET<span style="color:var(--accent)">PRO</span></h2></div>
    <div class="sidebar-nav">
        <div class="nav-item active" onclick="showPage('dash', event)"><i class="fas fa-chart-line"></i> Dashboard</div>
        <div class="nav-item" onclick="showPage('vehicles', event)"><i class="fas fa-car"></i> Véhicules</div>
        <div class="nav-item" onclick="showPage('fuel', event)"><i class="fas fa-gas-pump"></i> Carburant</div>
        <div class="nav-item" onclick="showPage('maintenance', event)"><i class="fas fa-tools"></i> Maintenance</div>
        <div class="nav-item" onclick="showPage('insurance', event)"><i class="fas fa-file-contract"></i> Assurance</div>
        <div class="nav-item" onclick="showPage('drivers', event)"><i class="fas fa-users"></i> Personnel</div>
        <div class="nav-item" onclick="showPage('missions', event)"><i class="fas fa-clipboard-list"></i> Missions</div>
        <div class="nav-item" onclick="showPage('settings', event)"><i class="fas fa-cog"></i> Paramètres</div>
    </div>
</div>

<div class="main-content" id="app-main" style="display:none">
    <div class="top-bar">
        <h2 id="page-title">Tableau de Bord</h2>
        <button class="btn btn-info" onclick="window.print()"><i class="fas fa-file-pdf"></i> GÉNÉRER PDF</button>
    </div>

    <div id="page-dash" class="page active">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;" id="stat-cards"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;">
            <div class="table-container"><canvas id="chartStatus"></canvas></div>
            <div class="table-container"><canvas id="chartFuel"></canvas></div>
        </div>
    </div>

    <div id="page-vehicles" class="page">
        <div style="display:flex;justify-content:space-between"><h3>Parc Automobile</h3><button class="btn btn-primary" onclick="openVehicleModal()">+ Nouveau</button></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th><th>Modèle</th><th>Plaque</th>
                        <th style="color:var(--accent); background:rgba(255,107,53,0.05)">KM ACTUEL</th>
                        <th>État</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="list-vehicles"></tbody>
            </table>
        </div>
    </div>

    <div id="page-settings" class="page">
        <h3>Paramètres du Système</h3>
        <div class="table-container" style="max-width:500px">
            <label>Nom de l'Unité</label>
            <input type="text" id="cfg-unit" style="width:100%;padding:10px;margin:10px 0;">
            <label>Changer le Code Secret</label>
            <input type="password" id="cfg-new-code" placeholder="Nouveau code" style="width:100%;padding:10px;margin:10px 0;">
            <button class="btn btn-primary" onclick="saveSettings()" style="width:100%;justify-content:center">ENREGISTRER</button>
        </div>
    </div>
    
    </div>

<script>
// INITIALISATION DES CLÉS (VOTRE STRUCTURE)
const KEYS = { config: 'fmp_cfg', v: 'fmp_v', f: 'fmp_f', m: 'fmp_m', i: 'fmp_i', d: 'fmp_d', o: 'fmp_o' };
let config = JSON.parse(localStorage.getItem(KEYS.config)) || { code: '301', unit: 'BA 301' };

function load(key) { return JSON.parse(localStorage.getItem(KEYS[key])) || []; }
function save(key, data) { localStorage.setItem(KEYS[key], JSON.stringify(data)); }

function initApp() {
    document.getElementById('lock-unit-name').textContent = config.unit;
    document.getElementById('cfg-unit').value = config.unit;
    renderVehicles();
    updateStats();
    // Vos graphiques s'initialisent ici
}

function verifyLogin() {
    if(document.getElementById('access-code').value === config.code) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('app-main').style.display = 'flex';
        initCharts();
    } else { alert("Code incorrect"); }
}

function saveSettings() {
    config.unit = document.getElementById('cfg-unit').value;
    const nc = document.getElementById('cfg-new-code').value;
    if(nc) config.code = nc;
    localStorage.setItem(KEYS.config, JSON.stringify(config));
    alert("Paramètres mis à jour !");
    location.reload();
}

// RENDU DES VÉHICULES AVEC KM ACTUEL
function renderVehicles() {
    const list = document.getElementById('list-vehicles');
    const data = load('v');
    list.innerHTML = data.map(v => `
        <tr>
            <td><img src="${v.img || ''}" style="width:40px;height:40px;object-fit:cover;border-radius:5px"></td>
            <td><b>${v.model}</b></td>
            <td>${v.plate}</td>
            <td style="color:var(--accent); font-weight:700">${(v.km || 0).toLocaleString()} KM</td>
            <td><span style="color:${v.state==='En service'?'var(--success)':'var(--danger)'}">● ${v.state}</span></td>
            <td><button onclick="editVeh(${v.id})">Modifier</button></td>
        </tr>
    `).join('');
}

// TOUTES VOS AUTRES FONCTIONS (FUEL, MAINTENANCE, DRIVERS, MISSIONS) SONT PRÉSENTES
function showPage(id, e) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
    if(e) e.currentTarget.classList.add('active');
    document.getElementById('page-title').textContent = id.toUpperCase();
}

function initCharts() {
    // Moteur Chart.js identique à votre original
    const ctx = document.getElementById('chartStatus').getContext('2d');
    new Chart(ctx, { type: 'doughnut', data: { labels: ['Service', 'Panne'], datasets: [{ data: [5, 1], backgroundColor: ['#28a745', '#dc3545'] }] } });
}
</script>
</body>
</html>
