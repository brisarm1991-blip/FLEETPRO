<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="tab-title">TrustFleet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary: #1a2d4a; --primary-light: #243d63; --accent: #ff6b35; --success: #28a745;
  --danger: #dc3545; --warning: #ffc107; --info: #17a2b8; --bg: #f0f4f8;
  --text: #2c3e50; --border: #dee2e6; --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px; --sidebar-width: 260px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}

/* SÉCURITÉ */
#lock-screen { position:fixed; inset:0; background:var(--primary); z-index:9999; display:flex; align-items:center; justify-content:center; }
.lock-box { background:white; padding:40px; border-radius:15px; width:350px; text-align:center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.lock-box input { width:100%; padding:12px; margin:15px 0; border:1px solid var(--border); border-radius:8px; text-align:center; }

/* LAYOUT */
.sidebar{width:var(--sidebar-width);background:var(--primary);color:#fff;position:fixed;height:100vh;z-index:100;}
.sidebar-header{padding:25px; border-bottom:1px solid rgba(255,255,255,0.1); text-align:center;}
.nav-item{padding:12px 20px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:.2s; color:rgba(255,255,255,0.7);}
.nav-item:hover, .nav-item.active{background:rgba(255,255,255,0.1); color:white; border-left:4px solid var(--accent);}

.main{margin-left:var(--sidebar-width); flex:1; display:none;}
.header{background:#fff; padding:0 30px; height:70px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;}
.content{padding:25px;}
.page{display:none;} .page.active{display:block;}

/* COMPOSANTS */
.card{background:white; padding:20px; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px;}
.table-wrap{background:white; border-radius:var(--radius); overflow-x:auto; box-shadow:var(--shadow);}
table{width:100%; border-collapse:collapse;}
th{background:#f8f9fa; padding:12px; text-align:left; font-size:.75rem; text-transform:uppercase; border-bottom:2px solid var(--border);}
td{padding:12px; border-bottom:1px solid var(--border); font-size:.85rem; vertical-align:middle;}
.img-thumb{width:45px; height:45px; border-radius:8px; object-fit:cover; border:1px solid var(--border);}

.btn{padding:10px 18px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; display:inline-flex; align-items:center; gap:8px;}
.btn-primary{background:var(--primary); color:white;}
.btn-accent{background:var(--accent); color:white;}
.btn-secondary{background:#6c757d; color:white;}

.modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(3px);}
.modal-overlay.open{display:flex;}
.modal{background:white; border-radius:12px; width:90%; max-width:600px; padding:25px; max-height:90vh; overflow-y:auto;}
</style>
</head>
<body onload="applyConfig()">

<div id="lock-screen">
  <div class="lock-box">
    <i class="fas fa-car fa-3x" style="color:var(--primary)"></i>
    <h2 id="lock-title">TrustFleet</h2>
    <input type="password" id="pass" placeholder="Code d'accès">
    <button class="btn btn-primary" style="width:100%; justify-content:center" onclick="login()">Accéder</button>
  </div>
</div>

<nav class="sidebar">
  <div class="sidebar-header">
    <i class="fas fa-car fa-2x" style="color:var(--accent)"></i>
    <h3 id="side-title">TrustFleet</h3>
  </div>
  <div class="nav-section">
    <div class="nav-item active" onclick="showPage('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</div>
    <div class="nav-item" onclick="showPage('vehicles')"><i class="fas fa-truck"></i> Véhicules</div>
    <div class="nav-item" onclick="showPage('drivers')"><i class="fas fa-users-cog"></i> Chauffeurs</div>
    <div class="nav-item" onclick="showPage('settings')" style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.1)"><i class="fas fa-cog"></i> Paramètres</div>
  </div>
</nav>

<div class="main" id="app">
  <header class="header">
    <h2 id="title-header">DASHBOARD</h2>
    <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> PDF</button>
  </header>

  <div class="content">
    <div id="page-dashboard" class="page active">
      <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:15px; margin-bottom:20px;">
        <div class="card"><h4>Flotte</h4><h2 id="s-v">0</h2></div>
        <div class="card" style="color:var(--danger)"><h4>Pannes</h4><h2 id="s-p">0</h2></div>
        <div class="card"><h4>Chauffeurs</h4><h2 id="s-d">0</h2></div>
        <div class="card"><h4>Alertes</h4><h2 id="s-i">0</h2></div>
      </div>
      <div class="card"><canvas id="chartV" height="100"></canvas></div>
    </div>

    <div id="page-vehicles" class="page">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px">
        <h3>Registre Automobile</h3>
        <button class="btn btn-primary" onclick="openM('m-v')">Nouveau</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Photo</th><th>Véhicule</th><th>Immat.</th><th>Dotation</th><th>KM</th><th>État</th><th>Actions</th></tr></thead>
          <tbody id="t-v"></tbody>
        </table>
      </div>
    </div>

    <div id="page-settings" class="page">
        <h3>Configuration Générale</h3><br>
        <div class="card" style="max-width:500px">
            <div style="margin-bottom:15px">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">Nom de l'Unité / Application</label>
                <input type="text" id="set-unit-name" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:6px;">
            </div>
            <div style="margin-bottom:15px">
                <label style="display:block; margin-bottom:5px; font-weight:bold;">Nouveau Code d'Accès</label>
                <input type="password" id="set-new-pass" placeholder="Laisser vide pour ne pas changer" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:6px;">
            </div>
            <div style="display:flex; gap:10px">
                <button class="btn btn-accent" onclick="saveSettings()">Appliquer les changements</button>
                <button class="btn btn-secondary" onclick="showPage('dashboard')">Annuler</button>
            </div>
        </div>
    </div>
  </div>
</div>

<div id="m-v" class="modal-overlay"><div class="modal"><h3>Fiche Véhicule</h3><br>
<form id="f-v" onsubmit="save(event,'v','m-v')">
  <input type="hidden" id="v_id">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
    <input type="text" id="v1" placeholder="Marque" required style="padding:10px; border-radius:6px; border:1px solid #ccc">
    <input type="text" id="v2" placeholder="Modèle" required style="padding:10px; border-radius:6px; border:1px solid #ccc">
    <input type="text" id="v3" placeholder="Immatriculation" required style="padding:10px; border-radius:6px; border:1px solid #ccc">
    <input type="number" id="v_year" placeholder="Année Dotation" required style="padding:10px; border-radius:6px; border:1px solid #ccc">
    <input type="number" id="v4" placeholder="Kilométrage" required style="padding:10px; border-radius:6px; border:1px solid #ccc">
    <select id="v5" style="padding:10px; border-radius:6px; border:1px solid #ccc"><option>En service</option><option>En panne</option></select>
  </div><br>
  <div style="display:flex; gap:10px; justify-content:flex-end">
    <button type="button" class="btn btn-secondary" onclick="closeM('m-v')">Annuler</button>
    <button type="submit" class="btn btn-accent">Enregistrer</button>
  </div>
</form></div></div>

<script>
// CONFIGURATION GLOBALE
let config = JSON.parse(localStorage.getItem('trust_config')) || { pass: '301', unit: 'TrustFleet' };
let db = {
    v: JSON.parse(localStorage.getItem('v_301')) || [],
    d: JSON.parse(localStorage.getItem('d_301')) || []
};

// FONCTION CRITIQUE : APPLIQUE LE NOM PARTOUT
function applyConfig() {
    // 1. Titre de l'onglet
    document.title = config.unit;
    // 2. Titre de l'écran de verrouillage
    document.getElementById('lock-title').innerText = config.unit;
    // 3. Titre de la barre latérale (Sidebar)
    document.getElementById('side-title').innerText = config.unit;
    // 4. Remplir le champ dans les paramètres
    document.getElementById('set-unit-name').value = config.unit;
}

function login() { 
    if(document.getElementById('pass').value === config.pass) { 
        document.getElementById('lock-screen').style.display='none'; 
        document.getElementById('app').style.display='block'; 
        refresh(); 
    } else alert('Accès refusé'); 
}

function saveSettings() {
    const newName = document.getElementById('set-unit-name').value;
    const newPass = document.getElementById('set-new-pass').value;
    
    if(newName.trim() !== "") {
        config.unit = newName;
    }
    if(newPass.trim() !== "") {
        config.pass = newPass;
    }
    
    localStorage.setItem('trust_config', JSON.stringify(config));
    
    // On ré-applique immédiatement les changements visuels
    applyConfig();
    
    alert('Paramètres mis à jour avec succès !');
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    document.getElementById('title-header').textContent = pageId.toUpperCase();
}

function openM(id) { document.getElementById(id).classList.add('open'); }
function closeM(id) { document.getElementById(id).classList.remove('open'); }

function save(e, k, mid) {
    e.preventDefault();
    const id = document.getElementById(k+'_id').value;
    let o = { id: id ? parseInt(id) : Date.now() };
    if(k==='v') o = {...o, brand:document.getElementById('v1').value, model:document.getElementById('v2').value, plate:document.getElementById('v3').value, year:document.getElementById('v_year').value, km:document.getElementById('v4').value, state:document.getElementById('v5').value};
    
    if(id) { db[k] = db[k].map(x => x.id == id ? o : x); } else { db[k].push(o); }
    localStorage.setItem(k+'_301', JSON.stringify(db[k]));
    closeM(mid);
    refresh();
}

let chart;
function refresh() {
    document.getElementById('s-v').textContent = db.v.length;
    document.getElementById('s-p').textContent = db.v.filter(x=>x.state==='En panne').length;
    document.getElementById('t-v').innerHTML = db.v.map(x=>`<tr><td><i class="fas fa-truck fa-2x"></i></td><td>${x.brand} ${x.model}</td><td>${x.plate}</td><td>${x.year}</td><td>${x.km} km</td><td>${x.state}</td><td><i class="fas fa-trash" onclick="del('v',${x.id})"></i></td></tr>`).join('');
    
    const ctx = document.getElementById('chartV').getContext('2d');
    if(chart) chart.destroy();
    chart = new Chart(ctx, { type:'bar', data: { labels:['En Service', 'En Panne'], datasets:[{label:'Parc', data:[db.v.filter(x=>x.state==='En service').length, db.v.filter(x=>x.state==='En panne').length], backgroundColor:['#28a745','#dc3545']}] }, options:{animation:false}});
}
function del(k, id) { if(confirm('Supprimer ?')) { db[k] = db[k].filter(x=>x.id!==id); localStorage.setItem(k+'_301', JSON.stringify(db[k])); refresh(); } }
</script>
</body>
</html>
