<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 TrustFleet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary: #1a2d4a;
  --primary-light: #243d63;
  --accent: #ff6b35;
  --success: #28a745;
  --danger: #dc3545;
  --warning: #ffc107;
  --info: #17a2b8;
  --bg: #f0f4f8;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-muted: #6c757d;
  --border: #dee2e6;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --sidebar-width: 260px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden;}

/* Sidebar */
.sidebar{width:var(--sidebar-width);background:var(--primary);color:white;display:flex;flex-direction:column;position:fixed;height:100vh;transition:all 0.3s ease;z-index:1000;}
.sidebar-header{padding:25px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-header i{font-size:24px;color:var(--accent);}
.sidebar-header h2{font-size:18px;font-weight:600;letter-spacing:0.5px;}
.sidebar-menu{list-style:none;padding:20px 0;flex-grow:1;overflow-y:auto;}
.sidebar-menu li{padding:12px 25px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:all 0.2s;color:rgba(255,255,255,0.7);font-size:15px;position:relative;}
.sidebar-menu li:hover, .sidebar-menu li.active{background:var(--primary-light);color:white;}
.sidebar-menu li.active{border-left:4px solid var(--accent);}
.sidebar-menu li i{width:20px;text-align:center;font-size:18px;}

/* Main Content */
.main-content{flex-grow:1;margin-left:var(--sidebar-width);padding:30px;transition:all 0.3s ease;max-width:calc(100% - var(--sidebar-width));}
.card{background:white;padding:25px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:25px;}

/* Table Styles */
table{width:100%;border-collapse:collapse;margin-top:10px;}
th{text-align:left;padding:12px;border-bottom:2px solid var(--border);color:var(--text-muted);font-weight:600;font-size:12px;}
td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;}

/* Buttons */
.btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--primary);color:white;}
.btn-excel{background:#1D6F42;color:white;width:calc(100% - 40px);margin:20px;justify-content:center;}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <i class="fas fa-shield-alt"></i>
    <h2>TrustFleet</h2>
  </div>
  <ul class="sidebar-menu">
    <li class="active" onclick="showSection('dashboard')"><i class="fas fa-th-large"></i> <span>Tableau de bord</span></li>
    <li onclick="showSection('vehicles')"><i class="fas fa-car"></i> <span>Véhicules</span></li>
    <li onclick="showSection('drivers')"><i class="fas fa-id-card"></i> <span>Chauffeurs</span></li>
    <li onclick="showSection('fuel')"><i class="fas fa-gas-pump"></i> <span>Carburant</span></li>
  </ul>
  <button class="btn btn-excel" onclick="exportToExcel()">
    <i class="fas fa-file-excel"></i> <span>Exporter vers Excel</span>
  </button>
</div>

<div class="main-content">
  <div id="section-dashboard" class="content-section">
    <div class="card">
      <h2>Bienvenue sur TrustFleet</h2>
      <p>Votre base de données est prête. Utilisez le menu pour commencer la saisie.</p>
    </div>
  </div>

  <div id="section-vehicles" class="content-section" style="display:none">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Véhicules</h3>
        <button class="btn btn-primary" onclick="addVehicle()">+ Ajouter</button>
      </div>
      <table>
        <thead><tr><th>Modèle</th><th>Immatriculation</th><th>KM</th><th>État</th></tr></thead>
        <tbody id="list-v"></tbody>
      </table>
    </div>
  </div>
  
  <div id="section-drivers" class="content-section" style="display:none">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Chauffeurs</h3>
            <button class="btn btn-primary" onclick="addDriver()">+ Ajouter</button>
        </div>
        <table>
            <thead><tr><th>Nom</th><th>Matricule</th><th>Statut</th></tr></thead>
            <tbody id="list-d"></tbody>
        </table>
    </div>
  </div>

  <div id="section-fuel" class="content-section" style="display:none">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Consommation</h3>
            <button class="btn btn-primary" onclick="addFuel()">+ Saisir Plein</button>
        </div>
        <table>
            <thead><tr><th>Date</th><th>Véhicule</th><th>Litres</th><th>Montant</th></tr></thead>
            <tbody id="list-f"></tbody>
        </table>
    </div>
  </div>
</div>

<script>
const KEYS = { v: 'tf_vehicles', d: 'tf_drivers', f: 'tf_fuel' };

function load(key) {
  const data = localStorage.getItem(KEYS[key]);
  return data ? JSON.parse(data) : [];
}

function save(key, data) {
  localStorage.setItem(KEYS[key], JSON.stringify(data));
  updateUI();
}

function updateUI() {
  const vs = load('v');
  document.getElementById('list-v').innerHTML = vs.map(v => `
    <tr><td>${v.brand}</td><td>${v.plate}</td><td>${v.km}</td><td>${v.state}</td></tr>
  `).join('') || '<tr><td colspan="4">Aucun véhicule</td></tr>';

  const ds = load('d');
  document.getElementById('list-d').innerHTML = ds.map(d => `
    <tr><td>${d.name}</td><td>${d.mat}</td><td>${d.status}</td></tr>
  `).join('') || '<tr><td colspan="3">Aucun chauffeur</td></tr>';

  const fs = load('f');
  document.getElementById('list-f').innerHTML = fs.map(f => `
    <tr><td>${f.date}</td><td>${f.vehicle}</td><td>${f.liters}</td><td>${f.cost}</td></tr>
  `).join('') || '<tr><td colspan="4">Aucune donnée</td></tr>';
}

function addVehicle() {
  const brand = prompt("Modèle :");
  const plate = prompt("Plaque :");
  const km = prompt("KM :");
  if(brand && plate) {
    const data = load('v');
    data.push({brand, plate, km, state:'En service'});
    save('v', data);
  }
}

function addDriver() {
    const name = prompt("Nom :");
    const mat = prompt("Matricule :");
    if(name && mat) {
        const data = load('d');
        data.push({name, mat, status:'Actif'});
        save('d', data);
    }
}

function addFuel() {
    const vehicle = prompt("Immatriculation :");
    const liters = prompt("Litres :");
    const cost = prompt("Coût :");
    if(vehicle && liters) {
        const data = load('f');
        data.push({date: new Date().toLocaleDateString(), vehicle, liters, cost});
        save('f', data);
    }
}

function showSection(id) {
  document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
  document.getElementById('section-'+id).style.display = 'block';
  document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function exportToExcel() {
  const vs = load('v');
  const ds = load('d');
  const fs = load('f');
  
  let csv = "\uFEFFSECTION VEHICULES\nModèle;Plaque;KM;Etat\n";
  vs.forEach(v => csv += `${v.brand};${v.plate};${v.km};${v.state}\n`);
  
  csv += "\nSECTION CHAUFFEURS\nNom;Matricule;Statut\n";
  ds.forEach(d => csv += `${d.name};${d.mat};${d.status}\n`);

  csv += "\nSECTION CARBURANT\nDate;Véhicule;Litres;Coût\n";
  fs.forEach(f => csv += `${f.date};${f.vehicle};${f.liters};${f.cost}\n`);

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "TrustFleet_Rapport.csv";
  link.click();
}

window.onload = updateUI;
</script>
</body>
</html>
