<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustFleet Pro - BA 301</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #1e293b; --accent: #3b82f6; --bg: #f8fafc;
            --border: #e2e8f0; --text-main: #334155;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; background-color: var(--bg); color: var(--text-main); }

        /* SIDEBAR */
        .sidebar { width: 240px; background: var(--primary); color: white; height: 100vh; position: fixed; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav-item { padding: 12px 24px; cursor: pointer; display: flex; align-items: center; gap: 12px; color: #94a3b8; font-size: 0.85rem; }
        .nav-item.active { color: white; background: var(--accent); font-weight: 500; }

        /* MAIN CONTENT */
        .main { margin-left: 240px; flex: 1; display: none; }
        .header { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .content { padding: 25px; }
        .page { display: none; }
        .page.active { display: block; }

        /* TABLES & CARDS */
        .table-responsive { background: white; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 12px 20px; text-align: left; font-size: 0.7rem; text-transform: uppercase; color: #64748b; }
        td { padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }

        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
        .btn-add { background: var(--accent); color: white; }

        /* MODALS */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal { background: white; padding: 30px; border-radius: 12px; width: 400px; color: var(--primary); }
        .modal input, .modal select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid var(--border); border-radius: 6px; }

        #lock-screen { position: fixed; inset: 0; background: var(--primary); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; }
        .img-prev { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #eee; }

        /* --- CONFIGURATION IMPRESSION PDF --- */
        @media print {
            .sidebar, .btn, .header button, .nav-item, .sidebar-header { display: none !important; }
            .main { margin-left: 0 !important; width: 100% !important; }
            .header { border-bottom: 2px solid #000; }
            .content { padding: 0; }
            body { background: white; }
            .table-responsive { border: none; }
            th { background: #eee !important; color: black !important; border: 1px solid #ddd; }
            td { border: 1px solid #ddd; }
        }
    </style>
</head>
<body onload="checkInit()">

<div id="lock-screen">
    <h2 style="font-weight: 300;">TRUSTFLEET <span style="color:var(--accent); font-weight: 600;">PRO</span></h2>
    <input type="password" id="pass" placeholder="Code d'accès" style="padding:12px; border-radius:6px; border:none; margin: 20px 0; text-align: center; width: 220px;">
    <button class="btn btn-add" onclick="login()">CONNEXION</button>
</div>

<div class="sidebar">
    <div class="sidebar-header"><h3 id="side-title">BA 301</h3></div>
    <div class="nav-item active" onclick="showPage('dashboard')"><i class="fas fa-th-large"></i> ACCUEIL</div>
    <div class="nav-item" onclick="showPage('vehicles')"><i class="fas fa-car-side"></i> VÉHICULES</div>
    <div class="nav-item" onclick="showPage('fuel')"><i class="fas fa-gas-pump"></i> CARBURANT</div>
    <div class="nav-item" onclick="showPage('maint')"><i class="fas fa-wrench"></i> ENTRETIEN</div>
    <div class="nav-item" onclick="showPage('drivers')"><i class="fas fa-user-check"></i> CHAUFFEURS</div>
    <div class="nav-item" onclick="showPage('settings')" style="margin-top:30px;"><i class="fas fa-cog"></i> PARAMÈTRES</div>
</div>

<div class="main" id="app">
    <div class="header">
        <h2 id="title-header">TABLEAU DE BORD</h2>
        <button class="btn btn-add" onclick="window.print()"><i class="fas fa-print"></i> GÉNÉRER PDF</button>
    </div>

    <div class="content">
        <div id="page-dashboard" class="page active">
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:20px; margin-bottom:20px;">
                <div style="background:white; padding:15px; border-radius:8px; border:1px solid var(--border)">VÉHICULES <br> <b id="s-v" style="font-size:1.5rem">0</b></div>
                <div style="background:white; padding:15px; border-radius:8px; border:1px solid var(--border)">PANNE <br> <b id="s-p" style="font-size:1.5rem; color:red">0</b></div>
                <div style="background:white; padding:15px; border-radius:8px; border:1px solid var(--border)">LITRES <br> <b id="s-f" style="font-size:1.5rem">0</b></div>
                <div style="background:white; padding:15px; border-radius:8px; border:1px solid var(--border)">EFFECTIF <br> <b id="s-d" style="font-size:1.5rem">0</b></div>
            </div>
            <canvas id="chartV" height="100"></canvas>
        </div>

        <div id="page-vehicles" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center;"><h3>PARC AUTOMOBILE</h3><button class="btn btn-add" onclick="openM('m-v')">+ AJOUTER</button></div>
            <div class="table-responsive">
                <table>
                    <thead><tr><th>Photo</th><th>Modèle</th><th>Plaque</th><th>KM ACTUEL</th><th>État</th><th>Actions</th></tr></thead>
                    <tbody id="t-v"></tbody>
                </table>
            </div>
        </div>

        <div id="page-fuel" class="page">
            <h3>LOGISTIQUE CARBURANT</h3>
            <div class="table-responsive"><table><thead><tr><th>Date</th><th>Véhicule</th><th>Litres</th><th>KM Saisi</th></tr></thead><tbody id="t-f"></tbody></table></div>
        </div>

        <div id="page-settings" class="page">
            <h3>PARAMÈTRES SÉCURITÉ & UNITÉ</h3>
            <div style="background:white; padding:25px; border-radius:8px; border:1px solid var(--border); max-width:400px;">
                <label>NOM DE LA BASE / UNITÉ</label>
                <input type="text" id="set-unit-name">
                
                <label>CHANGER LE CODE D'ACCÈS</label>
                <input type="password" id="set-pass" placeholder="Nouveau code">
                
                <button class="btn btn-add" onclick="saveSettings()" style="width:100%; justify-content:center;">ENREGISTRER LES MODIFICATIONS</button>
            </div>
        </div>
        
        <div id="page-maint" class="page"><div class="table-responsive"><table id="t-m"></table></div></div>
        <div id="page-drivers" class="page"><div class="table-responsive"><table id="t-d"></table></div></div>
    </div>
</div>

<div id="m-v" class="modal-overlay"><div class="modal">
    <h3>Nouveau Véhicule</h3>
    <input type="text" id="v1" placeholder="Ex: Toyota Hilux">
    <input type="text" id="v2" placeholder="N° Plaque">
    <input type="number" id="v3" placeholder="Kilométrage au compteur">
    <select id="v4"><option>En service</option><option>En panne</option></select>
    <input type="file" onchange="encodeImg(this,'v_img')"><input type="hidden" id="v_img">
    <button class="btn btn-add" onclick="handleSave('v')">SAUVEGARDER</button>
    <button class="btn" onclick="closeM('m-v')">FERMER</button>
</div></div>

<script>
let config = JSON.parse(localStorage.getItem('trust_config')) || { pass: '301', unit: 'BA 301' };
let db = { 
    v: JSON.parse(localStorage.getItem('v_301')) || [], 
    f: JSON.parse(localStorage.getItem('f_301')) || [],
    m: [], d: [] 
};

function checkInit() {
    document.getElementById('side-title').innerText = config.unit;
    document.getElementById('set-unit-name').value = config.unit;
}

function login() {
    if(document.getElementById('pass').value === config.pass) {
        document.getElementById('lock-screen').style.display='none';
        document.getElementById('app').style.display='block';
        refresh();
    } else alert('Code erroné');
}

function saveSettings() {
    config.unit = document.getElementById('set-unit-name').value;
    const newPass = document.getElementById('set-pass').value;
    if(newPass) config.pass = newPass;
    localStorage.setItem('trust_config', JSON.stringify(config));
    alert('Modifications enregistrées !');
    location.reload();
}

function handleSave(type) {
    if(type==='v'){
        const item = {
            id: Date.now(),
            name: document.getElementById('v1').value,
            plate: document.getElementById('v2').value,
            km: document.getElementById('v3').value,
            state: document.getElementById('v4').value,
            img: document.getElementById('v_img').value
        };
        if(!item.plate) return alert('Plaque requise');
        db.v.push(item);
        localStorage.setItem('v_301', JSON.stringify(db.v));
    }
    closeM('m-v'); refresh(); alert('Données enregistrées');
}

function refresh() {
    document.getElementById('s-v').textContent = db.v.length;
    document.getElementById('s-p').textContent = db.v.filter(x=>x.state==='En panne').length;
    
    const noImg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'%3E%3Cpath d='M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z'/%3E%3C/svg%3E";
    
    // Affichage avec la colonne KM bien présente
    document.getElementById('t-v').innerHTML = db.v.map(x=>`
        <tr>
            <td><img src="${x.img||noImg}" class="img-prev"></td>
            <td>${x.name}</td>
            <td><b>${x.plate}</b></td>
            <td style="color:var(--accent); font-weight:600">${x.km} KM</td>
            <td>${x.state}</td>
            <td><i class="fas fa-trash" onclick="del('v',${x.id})" style="cursor:pointer"></i></td>
        </tr>
    `).join('');
}

function showPage(pId) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+pId).classList.add('active');
    document.getElementById('title-header').innerText = pId.toUpperCase();
}
function openM(id){ document.getElementById(id).style.display='flex'; }
function closeM(id){ document.getElementById(id).style.display='none'; }
function encodeImg(input,hid){const r=new FileReader();r.onload=(e)=>document.getElementById(hid).value=e.target.result;if(input.files[0])r.readAsDataURL(input.files[0]);}
function del(k,id){ if(confirm('Supprimer ?')){db[k]=db[k].filter(x=>x.id!==id); localStorage.setItem(k+'_301',JSON.stringify(db[k])); refresh();}}
</script>
</body>
</html>
