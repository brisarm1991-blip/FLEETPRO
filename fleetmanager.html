<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustFleet Pro v3.9 | CI BA301</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary: #1a2d4a; --primary-light: #243d63; --accent: #ff6b35; --success: #28a745;
  --danger: #dc3545; --bg: #f0f4f8; --text: #2c3e50; --border: #dee2e6; --shadow: 0 4px 15px rgba(0,0,0,0.1); --radius: 12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI', Tahoma, sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}

/* --- ZOOM PHOTO --- */
.img-preview { width:45px; height:45px; border-radius:8px; object-fit:cover; border:1px solid var(--border); cursor: pointer; transition: transform 0.2s; }
.img-preview:hover { transform: scale(5); position: relative; z-index: 1000; box-shadow: var(--shadow); }

/* --- LOGIN --- */
#login-screen { position:fixed; inset:0; background:var(--primary); display:flex; align-items:center; justify-content:center; z-index:9999; color:white; }
.login-box { background:white; color:var(--text); padding:40px; border-radius:var(--radius); width:100%; max-width:400px; text-align:center; }
.login-box input { width:100%; padding:12px; margin:10px 0; border:1px solid var(--border); border-radius:8px; }

/* --- LAYOUT --- */
#app-interface { display:none; }
.sidebar { width:260px; background:var(--primary); color:white; position:fixed; height:100vh; display:flex; flex-direction:column; }
.sidebar-header { padding:25px; border-bottom:1px solid rgba(255,255,255,0.1); text-align:center; font-weight:bold; }
.sidebar-header i { font-size: 35px; color: var(--accent); display: block; margin-bottom: 10px; }
.sidebar-menu { list-style:none; padding:20px 0; flex-grow:1; }
.sidebar-menu li { padding:12px 25px; cursor:pointer; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:15px; }
.sidebar-menu li.active { background:var(--primary-light); color:white; border-left:5px solid var(--accent); }

.main-content { margin-left:260px; padding:30px; width:calc(100% - 260px); }
.card { background:white; padding:20px; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:25px; }
.table-container { overflow-x:auto; margin-top:15px; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:12px; border-bottom:2px solid var(--border); font-size:11px; color:#888; text-transform:uppercase; }
td { padding:12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }

.actions { display: flex; gap: 12px; }
.btn-action { cursor: pointer; transition: 0.2s; }
.btn-print { color: var(--info); }
.btn-edit { color: var(--primary); }
.btn-delete { color: var(--danger); }

/* --- MODALS --- */
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; align-items:center; justify-content:center; }
.modal-content { background:white; width:95%; max-width:650px; border-radius:var(--radius); padding:25px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
.form-grid input, .form-grid select { width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; }

.btn { padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; display: inline-flex; align-items:center; gap:8px; }
.btn-primary { background:var(--primary); color:white; }
.btn-accent { background:var(--accent); color:white; }

/* --- STYLE IMPRESSION --- */
@media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; color: black; }
    .no-print { display: none !important; }
}
</style>
</head>
<body>

<div id="print-area" style="display:none;"></div>

<div id="login-screen">
  <div class="login-box">
    <i class="fas fa-truck-front fa-3x" style="color:var(--primary); margin-bottom:15px;"></i>
    <h2>TrustFleet Security</h2>
    <input type="text" id="user-id" placeholder="Identifiant">
    <input type="password" id="user-pass" placeholder="Mot de passe">
    <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="checkAuth()">Connexion</button>
  </div>
</div>

<div id="app-interface">
  <div class="sidebar">
    <div class="sidebar-header"><i class="fas fa-shield-alt"></i> CI BA301 GAROUA</div>
    <ul class="sidebar-menu">
      <li class="active" onclick="showSection('dashboard', this)"><i class="fas fa-chart-line"></i> Dashboard</li>
      <li onclick="showSection('vehicles', this)"><i class="fas fa-truck-pickup"></i> Véhicules</li>
      <li onclick="showSection('drivers', this)"><i class="fas fa-user-shield"></i> Chauffeurs</li>
    </ul>
  </div>

  <div class="main-content">
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
      <h1 id="section-title">Tableau de Bord</h1>
      <div id="date-display" style="font-weight:600;"></div>
    </header>

    <div id="section-dashboard" class="content-section">
        <div class="card" style="text-align:center"><h4>KM Total Flotte</h4><h2 id="dash-km">0</h2></div>
    </div>

    <div id="section-vehicles" class="content-section" style="display:none">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Parc Automobile</h3>
            <button class="btn btn-accent" onclick="openModal('vehicle')">+ Nouveau</button>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Photo</th><th>Marque</th><th>Modèle</th><th>Immat.</th><th>Châssis</th><th>Dotation</th><th>KM</th><th>Actions</th></tr></thead>
                <tbody id="tbody-vehicles"></tbody>
            </table>
        </div>
      </div>
    </div>

    <div id="section-drivers" class="content-section" style="display:none">
        <div class="card"><h3>Chauffeurs</h3><tbody id="tbody-drivers"></tbody></div>
    </div>
  </div>
</div>

<div id="modal-vehicle" class="modal">
    <div class="modal-content">
        <h3>Fiche Véhicule</h3><br>
        <form id="form-vehicle">
            <input type="hidden" name="id">
            <div class="form-grid">
                <input type="text" name="brand" placeholder="Marque" required>
                <input type="text" name="model" placeholder="Modèle" required>
                <input type="text" name="plate" placeholder="Immatriculation" required>
                <input type="text" name="chassis" placeholder="N° Châssis">
                <input type="number" name="year" placeholder="Année de dotation">
                <input type="number" name="km" placeholder="KM Actuel" required>
                <input type="file" onchange="processImg(this, 'h-v')">
                <input type="hidden" name="image" id="h-v">
            </div><br>
            <button type="button" class="btn btn-primary" onclick="handleSave('vehicles','vehicle')">Enregistrer</button>
            <button type="button" class="btn" onclick="closeModal('vehicle')">Fermer</button>
        </form>
    </div>
</div>

<script>
const DB_KEYS = { vehicles: 'tf_vh_39', drivers: 'tf_dr_39' };

function checkAuth() { launch(); } // Simplifié pour test
function launch() { document.getElementById('login-screen').style.display='none'; document.getElementById('app-interface').style.display='block'; refreshUI(); }

function processImg(input, hid) {
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = (img.height * 400) / img.width;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            document.getElementById(hid).value = canvas.toDataURL('image/jpeg', 0.8);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function load(k) { return JSON.parse(localStorage.getItem(DB_KEYS[k])) || []; }

function handleSave(k, type) {
    const f = document.getElementById('form-'+type), d = load(k);
    const item = Object.fromEntries(new FormData(f).entries());
    if(item.id) {
        const idx = d.findIndex(x => x.id == item.id);
        if(!item.image && d[idx].image) item.image = d[idx].image;
        d[idx] = item;
    } else { item.id = Date.now(); d.push(item); }
    localStorage.setItem(DB_KEYS[k], JSON.stringify(d)); refreshUI(); closeModal(type);
}

function printVehicle(id) {
    const v = load('vehicles').find(x => x.id == id);
    const area = document.getElementById('print-area');
    area.innerHTML = `
        <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:20px;">
            <h2>ARMEE DE L'AIR - BASE AERIENNE 301</h2>
            <h3>CENTRE D'INSTRUCTION - GAROUA</h3>
            <h4 style="margin-top:10px; text-decoration:underline;">FICHE TECHNIQUE DU VEHICULE</h4>
        </div>
        <div style="display:flex; gap:30px;">
            <div style="flex:1;">
                <img src="${v.image}" style="width:100%; border:1px solid #ccc; border-radius:5px;">
            </div>
            <div style="flex:1; font-size:18px; line-height:2;">
                <b>Marque :</b> ${v.brand}<br>
                <b>Modèle :</b> ${v.model}<br>
                <b>Immatriculation :</b> ${v.plate}<br>
                <b>N° Châssis :</b> ${v.chassis || 'N/A'}<br>
                <b>Année de dotation :</b> ${v.year || 'N/A'}<br>
                <b>Kilométrage Actuel :</b> ${v.km} KM<br>
                <b>Date du rapport :</b> ${new Date().toLocaleDateString()}
            </div>
        </div>
        <div style="margin-top:50px; display:flex; justify-content:space-around;">
            <p><u>Le Chef de Garage</u></p>
            <p><u>Le Commandant du CI</u></p>
        </div>
    `;
    window.print();
}

function refreshUI() {
    const v = load('vehicles');
    document.getElementById('dash-km').textContent = v.reduce((s,c)=>s+parseInt(c.km||0),0).toLocaleString() + " KM";
    document.getElementById('tbody-vehicles').innerHTML = v.map(x=>`<tr>
        <td><img src="${x.image || ''}" class="img-preview"></td>
        <td>${x.brand}</td><td>${x.model}</td><td>${x.plate}</td><td>${x.chassis || '-'}</td><td>${x.year || '-'}</td><td>${x.km}</td>
        <td class="actions">
            <i class="fas fa-print btn-action btn-print" onclick="printVehicle(${x.id})" title="Imprimer Fiche"></i>
            <i class="fas fa-edit btn-action btn-edit" onclick="editItem('vehicles','vehicle',${x.id})"></i>
            <i class="fas fa-trash btn-action btn-delete" onclick="deleteItem('vehicles',${x.id})"></i>
        </td>
    </tr>`).join('');
}

function showSection(id, el) {
    document.querySelectorAll('.content-section').forEach(s => s.style.display='none');
    document.getElementById('section-'+id).style.display='block';
    document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
    el.classList.add('active');
}
function editItem(key, type, id) {
    const item = load(key).find(x => x.id == id);
    openModal(type);
    const f = document.getElementById('form-'+type);
    Object.keys(item).forEach(k => { if(f.elements[k] && f.elements[k].type !== 'file') f.elements[k].value = item[k]; });
}
function deleteItem(key, id) { if(confirm("Supprimer ?")) { localStorage.setItem(DB_KEYS[key], JSON.stringify(load(key).filter(x => x.id != id))); refreshUI(); } }
function openModal(t) { document.getElementById('modal-'+t).style.display='flex'; }
function closeModal(t) { document.getElementById('modal-'+t).style.display='none'; }
window.onload = () => { document.getElementById('date-display').textContent = new Date().toLocaleDateString('fr-FR'); };
</script>
</body>
</html>
