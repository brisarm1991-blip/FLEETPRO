<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 FleetManager Pro - BA 301</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary: #1a2d4a;
  --primary-light: #243d63;
  --accent: #ff6b35;
  --success: #28a745;
  --danger: #dc3545;
  --warning: #ffc107;
  --info: #17a2b8;
  --bg: #f0f4f8;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-muted: #6c757d;
  --border: #dee2e6;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --sidebar-width: 260px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}

/* --- AMÉLIORATION PDF : MASQUER SIDEBAR --- */
@media print {
  .sidebar, .btn, .top-bar button, .nav-item, .sidebar-header { display: none !important; }
  .main-content { margin-left: 0 !important; width: 100% !important; }
  .page { display: block !important; padding: 0; }
  .table-container { box-shadow: none; border: 1px solid #ccc; }
  body { background: white; }
}

.sidebar{width:var(--sidebar-width);background:var(--primary);color:#fff;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;transition:0.3s;}
.sidebar-header{padding:25px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-header h2{font-size:1.4rem;font-weight:700;letter-spacing:1px;color:#fff;}
.sidebar-nav{flex:1;padding:20px 0;}
.nav-item{padding:12px 25px;display:flex;align-items:center;color:rgba(255,255,255,0.7);text-decoration:none;cursor:pointer;transition:0.3s;font-size:0.95rem;position:relative;}
.nav-item i{width:25px;margin-right:10px;font-size:1.1rem;text-align:center;}
.nav-item:hover, .nav-item.active{background:var(--primary-light);color:#fff;border-left:4px solid var(--accent);}
.main-content{flex:1;margin-left:var(--sidebar-width);display:flex;flex-direction:column;transition:0.3s;}
.top-bar{height:70px;background:var(--card-bg);display:flex;align-items:center;justify-content:space-between;padding:0 30px;box-shadow:var(--shadow);position:sticky;top:0;z-index:90;}
.page{padding:30px;display:none;animation:fadeIn 0.4s;}
.page.active{display:block;}
.table-container{background:var(--card-bg);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);margin-top:20px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th{text-align:left;padding:12px 15px;background:#f8f9fa;color:var(--text-muted);font-weight:600;text-transform:uppercase;font-size:0.75rem;border-bottom:2px solid var(--border);}
td{padding:12px 15px;border-bottom:1px solid var(--border);font-size:0.9rem;}
.btn{padding:10px 18px;border-radius:6px;border:none;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:0.2s;}
.btn-primary{background:var(--accent);color:white;}
#lock-screen{position:fixed;inset:0;background:var(--primary);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;}
.lock-box{background:var(--primary-light);padding:40px;border-radius:15px;text-align:center;width:320px;}
.lock-box input{width:100%;padding:12px;margin:20px 0;border-radius:6px;border:none;text-align:center;font-size:1.2rem;}
@keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body onload="initApp()">

<div id="lock-screen">
  <div class="lock-box">
    <h2>BA 301</h2>
    <input type="password" id="access-code" placeholder="Code d'accès">
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="verifyLogin()">CONNEXION</button>
  </div>
</div>

<div class="sidebar">
  <div class="sidebar-header"><h2>FLEET<span style="color:var(--accent)">PRO</span></h2></div>
  <div class="sidebar-nav">
    <div class="nav-item active" onclick="showPage('dash')"><i class="fas fa-home"></i> Dashboard</div>
    <div class="nav-item" onclick="showPage('veh')"><i class="fas fa-car"></i> Véhicules</div>
    <div class="nav-item" onclick="showPage('sett')"><i class="fas fa-cog"></i> Paramètres</div>
  </div>
</div>

<div class="main-content" id="app-main" style="display:none">
  <div class="top-bar">
    <h2 id="page-title">Dashboard</h2>
    <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-file-pdf"></i> PDF</button>
  </div>

  <div class="page active" id="page-dash">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;" id="stat-cards"></div>
  </div>

  <div class="page" id="page-veh">
    <h3>PARC AUTOMOBILE</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Modèle</th>
            <th>Plaque</th>
            <th style="color:var(--accent)">KM ACTUEL</th> <th>État</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="vehicle-table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="page" id="page-sett">
    <h3>PARAMÈTRES</h3>
    <div class="table-container" style="max-width:400px">
      <label>Nom de l'unité</label>
      <input type="text" id="cfg-unit" style="width:100%;padding:10px;margin:10px 0;">
      <label>Modifier le code d'accès</label>
      <input type="password" id="cfg-new-code" placeholder="Nouveau code" style="width:100%;padding:10px;margin:10px 0;">
      <button class="btn btn-primary" onclick="saveSettings()" style="width:100%;justify-content:center">ENREGISTRER</button>
    </div>
  </div>
</div>

<script>
let config = JSON.parse(localStorage.getItem('fmp_config')) || { code: '301', unit: 'BA 301' };
let vehicles = JSON.parse(localStorage.getItem('fmp_v')) || [];

function initApp() {
  document.getElementById('cfg-unit').value = config.unit;
  renderVehicles();
}

function verifyLogin() {
  const input = document.getElementById('access-code').value;
  if(input === config.code) {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app-main').style.display = 'flex';
  } else { alert("Code incorrect"); }
}

function saveSettings() {
  config.unit = document.getElementById('cfg-unit').value;
  const nc = document.getElementById('cfg-new-code').value;
  if(nc) config.code = nc;
  localStorage.setItem('fmp_config', JSON.stringify(config));
  alert("Sauvegardé !");
  location.reload();
}

function renderVehicles() {
  const tbody = document.getElementById('vehicle-table-body');
  tbody.innerHTML = vehicles.map(v => `
    <tr>
      <td>${v.model}</td>
      <td><b>${v.plate}</b></td>
      <td style="color:var(--accent);font-weight:bold">${v.km || 0} KM</td>
      <td>${v.state}</td>
      <td><button onclick="delV(${v.id})"><i class="fas fa-trash"></i></button></td>
    </tr>
  `).join('');
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
}
</script>
</body>
</html>
