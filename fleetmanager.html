<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 TrustFleet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary: #1a2d4a;
  --primary-light: #243d63;
  --accent: #ff6b35;
  --success: #28a745;
  --danger: #dc3545;
  --warning: #ffc107;
  --info: #17a2b8;
  --bg: #f0f4f8;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-muted: #6c757d;
  --border: #dee2e6;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --sidebar-width: 260px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden;}

/* Sidebar */
.sidebar{width:var(--sidebar-width);background:var(--primary);color:white;display:flex;flex-direction:column;position:fixed;height:100vh;transition:all 0.3s ease;z-index:1000;}
.sidebar-header{padding:25px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.1);}
.sidebar-header i{font-size:24px;color:var(--accent);}
.sidebar-header h2{font-size:18px;font-weight:600;letter-spacing:0.5px;}
.sidebar-menu{list-style:none;padding:20px 0;flex-grow:1;overflow-y:auto;}
.sidebar-menu li{padding:12px 25px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:all 0.2s;color:rgba(255,255,255,0.7);font-size:15px;position:relative;}
.sidebar-menu li:hover, .sidebar-menu li.active{background:var(--primary-light);color:white;}
.sidebar-menu li.active{border-left:4px solid var(--accent);}
.sidebar-menu li i{width:20px;text-align:center;font-size:18px;}
.badge-nav{position:absolute;right:20px;background:var(--danger);color:white;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:bold;}

/* Main Content */
.main-content{flex-grow:1;margin-left:var(--sidebar-width);padding:30px;transition:all 0.3s ease;max-width:calc(100% - var(--sidebar-width));}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
.page-title h1{font-size:24px;font-weight:700;color:var(--primary);margin-bottom:5px;}
.user-profile{display:flex;align-items:center;gap:15px;background:white;padding:8px 15px;border-radius:50px;box-shadow:var(--shadow);}
.avatar{width:35px;height:35px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:20px;margin-bottom:30px;}
.stat-card{background:white;padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;gap:15px;}
.stat-icon{width:45px;height:45px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:white;}
.stat-info h3{font-size:22px;font-weight:700;}
.stat-info p{color:var(--text-muted);font-size:12px;}

/* Tables & Cards */
.card{background:white;padding:25px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:25px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:12px;border-bottom:2px solid var(--border);color:var(--text-muted);font-size:12px;text-transform:uppercase;}
td{padding:12px;border-bottom:1px solid var(--border);font-size:14px;}

/* Buttons */
.btn{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;font-size:14px;}
.btn-primary{background:var(--primary);color:white;}
.btn-excel{background:#1D6F42;color:white;width:calc(100% - 40px);margin:20px;justify-content:center;}
.btn-danger{background:var(--danger);color:white;padding:5px 10px;font-size:12px;}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center;}
.modal-content{background:white;width:90%;max-width:600px;border-radius:var(--radius);padding:30px;max-height:90vh;overflow-y:auto;}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header"><i class="fas fa-shield-alt"></i><h2>TrustFleet</h2></div>
  <ul class="sidebar-menu">
    <li class="active" onclick="showSection('dashboard')"><i class="fas fa-th-large"></i> <span>Tableau de bord</span></li>
    <li onclick="showSection('vehicles')"><i class="fas fa-car"></i> <span>Véhicules</span></li>
    <li onclick="showSection('drivers')"><i class="fas fa-id-card"></i> <span>Chauffeurs</span></li>
    <li onclick="showSection('maintenance')"><i class="fas fa-wrench"></i> <span>Entretiens</span></li>
    <li onclick="showSection('fuel')"><i class="fas fa-gas-pump"></i> <span>Carburant</span></li>
    <li onclick="showSection('insurance')"><i class="fas fa-file-contract"></i> <span>Documents</span> <span class="badge-nav" id="badge-alerts" style="display:none">0</span></li>
  </ul>
  <button class="btn btn-excel" onclick="exportToExcel()">
    <i class="fas fa-file-excel"></i> <span>Exporter vers Excel</span>
  </button>
</div>

<div class="main-content">
  <header>
    <div class="page-title"><h1 id="section-title">Tableau de bord</h1><p id="current-date"></p></div>
    <div class="user-profile"><div class="avatar">AD</div></div>
  </header>

  <div id="section-dashboard" class="content-section">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--primary)"><i class="fas fa-car"></i></div>
        <div class="stat-info"><h3 id="stat-v">0</h3><p>Véhicules</p></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:var(--success)"><i class="fas fa-gas-pump"></i></div>
        <div class="stat-info"><h3 id="stat-f">0</h3><p>Litres (Total)</p></div>
      </div>
    </div>
    <div class="card"><canvas id="chart-main" height="100"></canvas></div>
  </div>

  <div id="section-vehicles" class="content-section" style="display:none">
    <div class="card">
      <div class="card-header"><h3>Parc Automobile</h3><button class="btn btn-primary" onclick="openModal('v')">+ Ajouter</button></div>
      <table>
        <thead><tr><th>Véhicule</th><th>Immatriculation</th><th>KM Actuel</th><th>Statut</th><th>Action</th></tr></thead>
        <tbody id="tbody-v"></tbody>
      </table>
    </div>
  </div>

  <div id="section-fuel" class="content-section" style="display:none">
    <div class="card">
      <div class="card-header"><h3>Consommation Carburant</h3><button class="btn btn-primary" onclick="openModal('f')">+ Saisir Plein</button></div>
      <table>
        <thead><tr><th>Date</th><th>Véhicule</th><th>Litres</th><th>Montant</th><th>Station</th><th>Action</th></tr></thead>
        <tbody id="tbody-f"></tbody>
      </table>
    </div>
  </div>
  
  </div>

<script>
const KEYS = { v: 'tf_v1_v', d: 'tf_v1_d', m: 'tf_v1_m', f: 'tf_v1_f', i: 'tf_v1_i' };

// Chargement des données sans démo
function load(key) {
  const data = localStorage.getItem(KEYS[key]);
  return data ? JSON.parse(data) : [];
}

function save(key, data) {
  localStorage.setItem(KEYS[key], JSON.stringify(data));
  refreshUI();
}

function refreshUI() {
  renderVehicles();
  renderFuel();
  updateStats();
}

function renderVehicles() {
  const data = load('v');
  document.getElementById('tbody-v').innerHTML = data.map((v, index) => `
    <tr>
      <td><b>${v.brand}</b></td>
      <td><code>${v.plate}</code></td>
      <td>${v.km} km</td>
      <td>${v.state}</td>
      <td><button class="btn btn-danger" onclick="removeItem('v', ${index})">Suppr.</button></td>
    </tr>
  `).join('') || '<tr><td colspan="5">Aucun véhicule enregistré.</td></tr>';
}

function renderFuel() {
  const data = load('f');
  document.getElementById('tbody-f').innerHTML = data.map((f, index) => `
    <tr>
      <td>${f.date}</td>
      <td>${f.vehicle}</td>
      <td>${f.liters} L</td>
      <td>${f.cost}</td>
      <td>${f.station}</td>
      <td><button class="btn btn-danger" onclick="removeItem('f', ${index})">Suppr.</button></td>
    </tr>
  `).join('') || '<tr><td colspan="6">Aucune donnée de carburant.</td></tr>';
}

function updateStats() {
  document.getElementById('stat-v').textContent = load('v').length;
  const fuel = load('f').reduce((acc, curr) => acc + parseFloat(curr.liters || 0), 0);
  document.getElementById('stat-f').textContent = fuel.toFixed(1);
}

function removeItem(key, index) {
  if(!confirm("Supprimer cet élément ?")) return;
  const data = load(key);
  data.splice(index, 1);
  save(key, data);
}

// Fonction d'exportation Excel CSV demandée
function exportToExcel() {
  const v = load('v');
  const f = load('f');
  const d = load('d');

  let csv = "\uFEFFSECTION VEHICULES\nMarque;Immatriculation;KM;Etat\n";
  v.forEach(x => csv += `${x.brand};${x.plate};${x.km};${x.state}\n`);
  
  csv += "\nSECTION CARBURANT\nDate;Véhicule;Litres;Montant;Station\n";
  f.forEach(x => csv += `${x.date};${x.vehicle};${x.liters};${x.cost};${x.station}\n`);

  csv += "\nSECTION CHAUFFEURS\nNom;Matricule;Statut\n";
  d.forEach(x => csv += `${x.name};${x.mat};${x.status}\n`);

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Rapport_TrustFleet_" + new Date().toLocaleDateString().replace(/\//g, '-') + ".csv";
  link.click();
}

function showSection(id) {
  document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
  document.getElementById('section-'+id).style.display = 'block';
  document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('section-title').textContent = event.currentTarget.innerText;
}

window.onload = () => {
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  refreshUI();
};
</script>
</body>
</html>
